# Envía las notificaciones de Organización Personal cada 15 minutos (GitHub puede retrasar unos minutos las tareas programadas).
# Necesita dos secretos en Settings → Secrets and variables → Actions: SUPABASE_SERVICE_KEY y VAPID_PRIVATE_KEY.
name: Notificaciones
on:
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: notificaciones
  cancel-in-progress: false
jobs:
  enviar:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install --no-save --no-package-lock web-push@3.6.7
      - run: node .github/scripts/notificar.mjs
        env:
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          VAPID_PRIVATE_KEY: ${{ secrets.VAPID_PRIVATE_KEY }}
