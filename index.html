    <div class="rows" id="ds-tipos">${DESCANSOS.map(([t, m], i) => `<button class="row" data-i="${i}"><span class="box" style="${i === 0 ? 'background:var(--text);border-color:var(--text)' : ''}"></span><span class="t"><div>${t}</div></span><span class="tag">${m} min</span></button>`).join('')}</div>
    <div class="field" style="margin-top:12px"><label>Duración</label><div class="chips" id="ds-min">${[5, 10, 15, 20, 30, 45].map(m => `<button class="chip${m === min ? ' on' : ''}" data-m="${m}">${m} min</button>`).join('')}</div></div>
    <div class="actions"><button class="link" id="ds-cancel">Cancelar</button><button class="primary" id="ds-go">Empezar</button></div>`);
  const pintar = () => { $('#ds-tipos').querySelectorAll('.box').forEach(b => { const on = DESCANSOS[+b.closest('[data-i]').dataset.i][0] === tipo; b.style.background = on ? 'var(--text)' : ''; b.style.borderColor = on ? 'var(--text)' : ''; }); $('#ds-min').querySelectorAll('.chip').forEach(c => c.classList.toggle('on', +c.dataset.m === min)); };
  $('#ds-tipos').addEventListener('click', e => { const b = e.target.closest('[data-i]'); if (!b) return; [tipo, min] = DESCANSOS[+b.dataset.i]; if (![5, 10, 15, 20, 30, 45].includes(min)) min = 15; pintar(); });
  $('#ds-min').addEventListener('click', e => { const c = e.target.closest('.chip'); if (!c) return; min = +c.dataset.m; pintar(); });

function startFocus(que, min, pro = '', animo = 0, tipo = 'enfoque') {
  ES.sesion = { inicio: Date.now(), min, que, pro, animo, tipo, ints: 0, fuera: 0, impulsos: 0 };
  guardar(); showFocus(); buzz(15);
  avisarAlTerminar(min);
}
// Aviso del sistema al terminar, si el teléfono deja que la app siga viva en segundo plano.
let avisoT = 0;
function avisarAlTerminar(min) {

  avisoT = setTimeout(async () => {
    if (Notification.permission !== 'granted' || document.visibilityState === 'visible') return;
    const reg = await navigator.serviceWorker?.getRegistration().catch(() => null);
    const txt = { body: 'Sesión de enfoque terminada. Vuelve para registrarla.', icon: 'icon-192.png', tag: 'enfoque' };

}
function focusLeft() { const s = ES.sesion; return s ? s.min * 60 - (Date.now() - s.inicio) / 1000 : 0; }
function showFocus() {
  const s = ES.sesion; if (!s) return;

    <p class="lead">${s.tipo === 'descanso' ? 'Descansando' : s.que ? 'Enfocado en' : 'Sesión de enfoque'}</p>

    ${ES.proyectos.find(x => x.id === s.pro)?.recompensa ? `<p class="meta" style="margin:0">Mientras tanto: ${esc(ES.proyectos.find(x => x.id === s.pro).recompensa)}</p>` : ''}

    <p class="lead" id="f-ints"></p>
    <p class="note">Bloquea el teléfono y déjalo boca abajo.</p>
    <button class="outline" id="f-urge">Tengo ganas de mirar el teléfono</button>
    <button class="link" id="f-stop">Terminar antes</button>`;
  $('#f-urge').onclick = () => {
    s.impulsos = (s.impulsos || 0) + 1; guardar();
    const pr = ES.proyectos.find(x => x.id === s.pro);
    showSheet(`<h2>Surfea el impulso</h2>
      <p class="note">Las ganas suben, llegan a un pico y bajan en un par de minutos si no las alimentas. Respira tres veces y obsérvalas.</p>
      <p class="why">${pr?.plan ? `Tu plan: si ${esc(pr.obstaculo || 'aparece el obstáculo')}, entonces ${esc(pr.plan)}.` : 'Si tengo ganas de mirar el teléfono, entonces respiro tres veces y hago la siguiente acción concreta.'}</p>
      <p class="meta">${s.impulsos} ${s.impulsos === 1 ? 'impulso' : 'impulsos'} en esta sesión. Notarlos ya es entrenar la atención.</p>
      <div class="actions"><button class="primary" id="fu-ok">Sigo</button></div>`);
    $('#fu-ok').onclick = closeSheet;
  };
  $('#focus').hidden = false;
  $('#f-stop').onclick = () => {
    const done = Math.floor((Date.now() - s.inicio) / 60000);

      <div class="actions"><button class="link" id="fs-no">Seguir</button><button class="primary" id="fs-yes">Terminar</button></div>`);
    $('#fs-no').onclick = closeSheet;

  clearInterval(focusTick); focusTick = setInterval(paintFocus, 500); paintFocus();
}
function paintFocus() {
  const s = ES.sesion; if (!s) return;

  if (left <= 0) { finishFocus(true); return; }
  $('#f-left').textContent = fmtClock(left);
  $('#ring').style.setProperty('--p', `${(1 - left / (s.min * 60)) * 100}%`);
  $('#f-ints').textContent = s.ints ? `${s.ints} ${s.ints === 1 ? 'interrupción' : 'interrupciones'}` : 'Sin interrupciones';
}
function finishFocus(completa) {

  const k = dayKey(new Date(s.inicio));
  clearTimeout(avisoT);
  if (s.tipo === 'descanso') {
    bump('descanso', mins, k); bump('interrupciones', s.ints, k); if (s.impulsos) bump('impulsos', s.impulsos, k);
    if (mins) xpGanar(Math.min(30, mins) + (completa && !s.ints ? 10 : 0), 'Descanso con propósito');
    ES.sesion = null; guardar(); $('#focus').hidden = true; renderE(); if (completa) buzz([40, 60, 40]);
    showSheet(`<h2>${completa ? 'Descanso completo' : 'Descanso terminado'}</h2>
      <p class="note">${fmtMin(mins)} de «${esc(s.que)}»${s.ints ? ` · ${s.ints} ${s.ints === 1 ? 'vez miraste el teléfono' : 'veces miraste el teléfono'}` : ' · sin tocar el teléfono'}. Descansar así también es hacer algo con propósito.</p>

  $('#focus').hidden = true; renderE();
  if (completa) buzz([60, 80, 60, 80, 120]);
  const pr = ES.proyectos.find(x => x.id === s.pro);
  showSheet(`<h2>${completa ? 'Sesión completa' : 'Sesión terminada'}</h2>
    <p class="note">${fmtMin(mins)} de enfoque${s.que ? ` en «${esc(s.que)}»` : ''} · ${s.ints ? `${s.ints} ${s.ints === 1 ? 'interrupción' : 'interrupciones'}` : 'sin interrupciones'}. Hoy llevas ${fmtMin(dayOf(k).enfoque)}.</p>
    ${s.ints === 0 && completa ? `<p class="meta green">Ni una mirada al teléfono. Así se entrena la atención.</p>` : ''}
    ${s.animo ? `<div class="field"><label>Empezaste con ánimo ${s.animo}. ¿Y ahora? (1–5)</label><div class="chips" id="fr-animo">${[1, 2, 3, 4, 5].map(n => `<button class="chip" data-v="${n}">${n}</button>`).join('')}</div></div>` : ''}

// ---------- La puerta: espera, recordatorio y límite antes de abrir una distracción
function appPicker() {
  const d = dayOf(), wait = gateWait();
  showSheet(`<h2>¿Qué quieres abrir?</h2>
    <p class="note">Aperturas hoy: ${d.aperturas} de ${ES.limite} · ${d.distraccion} de ${ES.presupuesto} min. La próxima espera es de ${fmtSec(wait)}${sobreLimite() ? ' y tendrás que escribir una frase' : ''}.</p>
    <p class="sci">${enVentana() ? `Estás en tu ventana de revisión hasta las ${fmtHora(addMin(enVentana(), ES.ventanaMin))}.` : `Fuera de tu ventana de revisión: la espera es el doble. La próxima es a las ${fmtHora(proximaVentana())}; lo que hay ahí seguirá ahí.`}</p>
    <div class="rows">${ES.apps.map(a => `<button class="row" data-app="${esc(a.id)}"><span class="dot"></span><span class="t"><div>${esc(a.nombre)}</div></span><span class="tag">›</span></button>`).join('')}</div>
    ${ES.apps.length ? '' : `<p class="empty">Añade tus apps en Ajustes.</p>`}
    <div class="actions"><button class="link" id="ap-close">Mejor no</button></div>`);
  $('#ap-close').onclick = () => { bump('resistidas'); guardar(); closeSheet(); renderE(); xpGanar(15, 'Resististe'); toast('Bien. Ese tiempo es tuyo.'); };
  $('#sheet-body').querySelectorAll('[data-app]').forEach(b => b.onclick = () => { closeSheet(); openGate(ES.apps.find(a => a.id === b.dataset.app)); });
}
// Cada apertura del día duplica la espera: 10 s, 20 s, 40 s… hasta 3 minutos.
// Fuera de las ventanas de revisión la espera es el doble (revisar por lotes, no a cada rato).
const gateWait = () => Math.min(240, ES.espera * 2 ** dayOf().aperturas * (enVentana() ? 1 : 2));
const toMin = hhmm => { const [h, m] = hhmm.split(':').map(Number); return h * 60 + m; };
const nowMin = () => { const d = new Date(); return d.getHours() * 60 + d.getMinutes(); };
function enVentana() { const n = nowMin(); return ES.ventanas.find(v => n >= toMin(v) && n < toMin(v) + ES.ventanaMin) || ''; }
function proximaVentana() { const n = nowMin(), vs = [...ES.ventanas].sort(); return vs.find(v => toMin(v) > n) || vs[0]; }
const sobreLimite = () => { const d = dayOf(); return d.aperturas >= ES.limite || d.distraccion >= ES.presupuesto; };
let gate = null;
function openGate(app) {
  if (!app) return;
  gate = { app, total: gateWait(), fin: 0 };
  gate.fin = Date.now() + gate.total * 1000;
  const why = recordatorio();
  gate.emo = '';
  $('#gate-body').innerHTML = `
    <p class="lead">Ibas a abrir <b>${esc(app.nombre)}</b></p>
    <div class="breath"><span id="g-br">Inhala</span></div>
    <p class="count" id="g-count"></p>
    ${why ? `<div class="why">${why}</div>` : ''}
    <div class="field" style="width:100%;margin:0"><label style="text-align:left">Mientras esperas: ¿qué sientes ahora?</label>
      <div class="chips" id="g-emo">${EMOCIONES.map(m => `<button class="chip" data-e="${m}">${m}</button>`).join('')}</div>
      <p class="meta" id="g-emo-tip" style="text-align:left;margin:8px 0 0"></p></div>
    ${ES.config.grises ? '' : `<p class="meta" style="margin:0">Con la pantalla en grises el feed atrae menos (Zimmermann y Sobolev, 2023).</p>`}
    <p class="note" style="margin:0">${enVentana() ? '' : `Fuera de tu ventana de revisión (próxima: ${fmtHora(proximaVentana())}). `}Si sales de esta pantalla, la espera vuelve a empezar.</p>
    <button class="primary wide" id="g-no">Mejor no</button>`;

  $('#g-emo').addEventListener('click', e => {
    const c = e.target.closest('.chip'); if (!c) return; gate.emo = c.dataset.e;
    $('#g-emo').querySelectorAll('.chip').forEach(x => x.classList.toggle('on', x === c));

  });

  });

}

function gateChoice() {

    <h2>¿Todavía quieres abrir ${esc(app.nombre)}?</h2>

    ${over && ES.pacto.semana === lunes() && ES.pacto.texto ? `<p class="why">Tu pacto de esta semana: ${esc(ES.pacto.texto)}</p>` : ''}
    ${over ? `<p class="lead red">Superaste tu límite de hoy. Para seguir, escribe: <b class="red">${FRASE}</b></p>

    const c = e.target.closest('.chip'); if (!c) return; min = +c.dataset.m;

    closeGate(); renderE();
    salidaOculta = false;

function gateNo() {
  if (gate?.emo) bump('emo_' + gate.emo);
  bump('resistidas'); guardar(); closeGate(); renderE(); buzz(20); xpGanar(15, 'Resististe');
  alternativas('Bien. Ese tiempo es tuyo', 'Úsalo en algo que sume:');
}
function closeGate() { if (gate) { clearInterval(gate.tick); clearInterval(gate.breath); } gate = null; $('#gate').hidden = true; }

// Al volver de la distracción se cuenta cuánto duró de verdad.
let salidaOculta = false;
function checkSalida(force = false) {
  const s = ES.salida; if (!s || (!salidaOculta && !force)) return;
  const mins = (Date.now() - s.en) / 60000;
  if (mins < .5 && !force) return;
  ES.salida = null;
  const k = dayKey(new Date(s.en));
  const medido = mins <= 240;
  const real = medido ? Math.max(1, Math.round(mins)) : s.min;
  bump('distraccion', real, k); guardar(); renderE();
  const extra = real - s.min;
  showSheet(`<h2>Volviste de ${esc(s.app)}</h2>
    <p class="note">${medido ? `Estuviste fuera unos ${fmtMin(real)}; planeaste ${fmtMin(s.min)}.` : 'No se pudo medir: pasaron más de 4 horas. Se cuentan los minutos que planeaste.'}</p>
    ${medido && extra > 1 ? `<p class="meta red">Te pasaste ${fmtMin(extra)}. La próxima espera será de ${fmtSec(gateWait())}.</p>` : medido ? `<p class="meta green">Cumpliste lo que planeaste.</p>` : ''}
    <h3 style="margin-top:20px">Prueba de realidad</h3>
    <p style="margin:0 0 12px">¿Había algo que de verdad te habrías perdido?</p>
    <div class="chips"><button class="chip" data-fomo="si">Sí, algo importante</button><button class="chip" data-fomo="no">No, nada importante</button></div>
    <div id="sv-after"></div>`);
  $('#sheet-body').querySelectorAll('[data-fomo]').forEach(b => b.onclick = () => {
    bump(b.dataset.fomo === 'si' ? 'fomoSi' : 'fomoNo', 1, k); guardar(); renderE();
    const all = Object.values(ES.dias), si = all.reduce((a, v) => a + (v.fomoSi || 0), 0), tot = si + all.reduce((a, v) => a + (v.fomoNo || 0), 0);
    $('#sheet-body').querySelector('.chips').outerHTML = `<p class="meta">Hasta ahora, en <b style="color:var(--text)">${tot - si} de ${tot}</b> aperturas no había nada importante. El miedo a perderse algo es una predicción; tus datos dicen otra cosa.</p>`;
    $('#sv-after').innerHTML = `<div class="actions stack">
      ${personasDue()[0] ? `<button class="primary" id="sv-per">Escríbele a ${esc(personasDue()[0].nombre)}</button>` : ''}
      <button class="${personasDue()[0] ? 'outline' : 'primary'}" id="sv-focus">Ahora, una sesión de enfoque</button>
      <button class="link" id="sv-close">Cerrar</button></div>`;
    $('#sv-per')?.addEventListener('click', () => personaSheet(personasDue()[0]));
    $('#sv-focus').onclick = () => focusForm();
    $('#sv-close').onclick = closeSheet;
  });
}

// ---------- Prioridades del día: tres como máximo y la más difícil primero.
function renderPrio() {
  const P = ES.prioridades.fecha === today() ? ES.prioridades : (ES.prioridades = { fecha: today(), items: [] });
  const done = P.items.filter(x => x.hecho).length;

function prioCandidatos() {

// ---------- Tomar la iniciativa: personas, planes y proyectos
const daysSince = d => d ? Math.round((new Date(today() + 'T12:00') - new Date(d + 'T12:00')) / 864e5) : Infinity;
const fmtDias = n => n === Infinity ? 'sin registro' : n === 0 ? 'hoy' : n === 1 ? 'ayer' : `hace ${n} días`;
const addMin = (hhmm, m) => { const t = (toMin(hhmm) + m) % 1440; return `${String(Math.floor(t / 60)).padStart(2, '0')}:${String(t % 60).padStart(2, '0')}`; };
const cap = s => s ? s[0].toUpperCase() + s.slice(1) : s;
const fechaLarga = f => new Date(f + 'T12:00').toLocaleDateString('es', { weekday: 'long', day: 'numeric', month: 'long' });
// A quién le toca: cuanto más se pasó de la frecuencia que elegiste, antes sale.
function personasDue() {
  return ES.personas.map(p => ({ p, r: daysSince(p.ultimo) / p.cada })).filter(x => x.r >= 1).sort((a, b) => b.r - a.r).map(x => x.p);
}
const ultimoPaso = pr => pr.pasos.length ? pr.pasos[pr.pasos.length - 1].d : pr.creado;
const proyectosActivos = () => ES.proyectos.filter(p => !p.archivado).sort((a, b) => a.prioridad - b.prioridad || (ultimoPaso(a) < ultimoPaso(b) ? -1 : ultimoPaso(a) > ultimoPaso(b) ? 1 : 0));
const PRIO = { 1: 'Alta', 2: 'Media', 3: 'Baja' };
const planesProximos = () => ES.planes.filter(p => !p.hecho && p.fecha >= today()).sort((a, b) => (a.fecha + a.hora) < (b.fecha + b.hora) ? -1 : 1);
const planesSinCerrar = () => ES.planes.filter(p => !p.hecho && p.fecha < today());
// Semana de lunes a hoy.
const semanaKeys = () => { const back = wd(today()); return Array.from({ length: back + 1 }, (_, i) => dayKey(addDays(new Date(), i - back))); };
const iniciativasSemana = () => semanaKeys().reduce((a, k) => a + dayOf(k).iniciativas, 0);
// Predicción frente a resultado: cuánto más pesimista eres que la realidad.
function sesgo() {
  const xs = ES.predicciones.filter(x => x.real); if (!xs.length) return null;
  return { n: xs.length, d: xs.reduce((a, x) => a + x.real - x.pred, 0) / xs.length };
}
const sesgoTxt = b => b && b.n >= 1 ? (b.d > 0.2 ? `Tus predicciones fueron, de media, <b>${b.d.toFixed(1).replace('.', ',')} puntos más pesimistas</b> que la realidad (${b.n} ${b.n === 1 ? 'contacto' : 'contactos'}).` : b.d < -0.2 ? `La realidad fue ${(-b.d).toFixed(1).replace('.', ',')} puntos peor de lo que esperabas (${b.n}). Sigue: la media se ajusta con más contactos.` : `Tus predicciones aciertan con la realidad (${b.n}).`) : '';

function planSheet(pl, nuevo = false) {

  const texto = `Hola${pl.con ? `, ${pl.con}` : ''}. ¿Te animas a ${pl.titulo} el ${fechaLarga(pl.fecha)} a las ${fmtHora(pl.hora)}?`;

  showSheet(`<h2>${esc(cap(pl.titulo))}${pl.con ? ' con ' + esc(pl.con) : ''}</h2>
    <p class="note">${cap(fechaLarga(pl.fecha))} · ${fmtHora(pl.hora)}${nuevo ? '. Ahora, envía la invitación y apártalo en el calendario.' : ''}</p>

      ${gCalOk() ? `<button class="outline" id="ps-gcal">Crear en mi Google Calendar</button>` : `<a class="outline btn" href="${cal}" target="_blank" rel="noopener">Añadir a Google Calendar</a>`}

    <p class="meta">Pasa pronto de lo superficial a lo profundo: resulta menos incómodo de lo que crees (Kardas et al., 2022). Haz preguntas de seguimiento y, ante una buena noticia, responde con entusiasmo y pregunta más (Gable et al., 2004).</p>`}

    showSheet(b.dataset.done === 'si'
      ? `<h2>Plan cumplido</h2><p class="note">Probablemente le caíste mejor de lo que piensas: después de conversar, casi todos subestimamos cuánto le gustamos a la otra persona (Boothby et al., 2018).</p>
        <div class="actions stack"><button class="primary" id="pd-next">Proponer el siguiente encuentro</button><button class="link" id="pd-close">Cerrar</button></div>`
      : `<h2>Se canceló</h2><p class="note">Pasa. Lo que cuenta es volver a proponerlo, con día y hora.</p>

// Día, hora y lugar del siguiente paso: el plan «si…, entonces…» con fecha y hora concretas.
function pasoCampos(pr) {
  return `<div class="times"><div class="field"><label>¿Qué día?</label><input id="pp-c" type="date" value="${esc(pr?.cuando)}"></div>
      <div class="field"><label>¿A qué hora?</label><input id="pp-h" type="time" value="${esc(pr?.hora)}"></div></div>

const leerPaso = () => ({ cuando: $('#pp-c').value, hora: $('#pp-h').value, donde: $('#pp-d').value.trim(), minima: $('#pp-m').value.trim() });
function calUrl(texto, fecha, hora, mins, lugar = '') {
  const a = new Date(`${fecha}T${hora}`), b = new Date(a.getTime() + mins * 60000);
  const f = d => dayKey(d).replaceAll('-', '') + 'T' + String(d.getHours()).padStart(2, '0') + String(d.getMinutes()).padStart(2, '0') + '00';
  return `https://calendar.google.com/calendar/render?action=TEMPLATE&text=${encodeURIComponent(texto)}&dates=${f(a)}/${f(b)}${lugar ? '&location=' + encodeURIComponent(lugar) : ''}`;
}

// Revisión semanal: logros, proyectos sin siguiente paso y bloques para la semana. Los lunes y el día 1 se ofrece sola.

  ES.revision = today(); guardar();

  const reporte = `Mi semana: ${fmtMin(sum('enfoque'))} de enfoque, ${sum('iniciativas')} iniciativas, ${victorias.length} pasos en proyectos${victorias.length ? ` (${victorias.slice(-3).map(v => v.t).join('; ')})` : ''}. Esta semana me comprometo a: ${prs.filter(p => p.paso).slice(0, 3).map(p => p.paso).join('; ') || '…'}.`;
  showSheet(`<h2>Revisión semanal</h2>
    <p class="note">Los comienzos (un lunes, un mes nuevo) son buen momento para retomar metas (Dai et al., 2014). Diez minutos bastan.</p>
    <h3 style="margin-top:8px">1. Lo que lograste</h3>
    <p class="meta">${fmtMin(sum('enfoque'))} de enfoque · ${sum('iniciativas')} iniciativas · ${victorias.length} pasos · resististe ${sum('resistidas') + sum('alternativas')} veces</p>

  const x = intervenciones().find(i => !fuera.includes(i.id));
  const el = $('#interv');
  if (!x) { el.innerHTML = ''; return; }
  el.innerHTML = `<div class="interv"><b>${esc(x.t)}</b><p>${esc(x.p)}</p><p class="sci">${esc(x.sci)}</p>
    <div class="row-b">${x.a ? `<button class="primary" id="iv-go">${esc(x.b)}</button>` : ''}<button class="link" id="iv-no">Ahora no</button></div></div>`;
  $('#iv-go')?.addEventListener('click', x.a);
  $('#iv-no').onclick = () => { local.descartes = { d: today(), ids: [...fuera, x.id] }; guardar(); renderInterv(); };
}

// ---------- Lo que pasa al salir y volver a la app
document.addEventListener('visibilitychange', () => {
  if (document.visibilityState === 'hidden') {
    if (ES.sesion && !ES.sesion.fuera) { ES.sesion.fuera = Date.now(); guardar(); }
    if (ES.salida) salidaOculta = true;
    return;
  }
  // De vuelta.
  renderE();
  if (gate && !gate.listo) { gate.fin = Date.now() + gate.total * 1000; paintGate(); toast('La espera vuelve a empezar.'); }
  const s = ES.sesion;
  if (s) {
    if (focusLeft() <= 0) finishFocus(true);
    else if (s.fuera) {
      s.ints++; s.fuera = 0; guardar(); paintFocus(); buzz(40);
      toast(`Tomaste el teléfono a los ${fmtMin((Date.now() - s.inicio) / 60000)}. Bloquéalo y sigue.`);
    }
  }
  checkSalida();
});

let agendaCache = { d: '', t: 0, items: null, err: '' };
async function cargarAgenda(force = false) {
  if (!gCalOk()) return;
  if (!force && agendaCache.d === today() && Date.now() - agendaCache.t < 5 * 60000) return;
  try {
    const desde = new Date(); desde.setHours(0, 0, 0, 0); const hasta = new Date(desde); hasta.setDate(hasta.getDate() + 1);
    agendaCache = { d: today(), t: Date.now(), items: await gCalEventos(desde, hasta), err: '' };
    if (agSyncEventos(agendaCache.items)) guardar();
  } catch (e) { agendaCache = { d: today(), t: Date.now(), items: null, err: e.message }; }
  renderAgenda(); if (view === 'agenda') renderAg();
}
const hhmm = d => `${String(d.getHours()).padStart(2, '0')}:${String(d.getMinutes()).padStart(2, '0')}`;

function escenarioDe(k) { for (const e of ESCENARIOS) { if (e.k === k) return e; const s = (e.sub || []).find(x => x.k === k); if (s) return { ...s, padre: e }; } return null; }
function escenarioSheet(k, subk = '') {
  const E = escenarioDe(k); if (!E) return;
  const S = E.sub ? (E.sub.find(x => x.k === subk) || E.sub[0]) : E, mente = prDe(E.mente || E.padre?.mente);
  showSheet(`<h2>${esc(E.n)}${E.sub ? ` · ${esc(S.n)}` : ''}</h2><p class="note">${esc(S.d)}</p>
    ${E.sub ? `<div class="chips" style="margin-bottom:14px">${E.sub.map(x => `<button class="chip${x.k === S.k ? ' on' : ''}" data-sub="${x.k}">${esc(x.n)}</button>`).join('')}</div>` : ''}
    <h3 style="margin-top:4px">La Palabra</h3>
    ${S.versos.map(([r, t]) => `<p style="margin:0 0 10px"><span style="font-size:1.02rem">«${esc(t)}»</span><br><a class="link" href="${YV(r)}" target="_blank" rel="noopener">${esc(refTxt(r))}</a></p>`).join('')}
    ${S.declaro ? `<h3>Declaro</h3><ul class="pros">${S.declaro.map(t => `<li>${esc(t)}</li>`).join('')}</ul><p class="meta">Dilo en voz baja, despacio, una vez por frase. Afirmar quién eres cambia cómo actúas (Cohen y Sherman, 2014).</p>` : ''}
    <div class="actions stack">
      <button class="primary" id="es-orar">Orar con esto · ${Math.round(S.oracion.reduce((a, p) => a + p[1], 0) / 60)} min</button>
      ${mente ? `<button class="outline" id="es-mente">Para la mente: ${esc(mente.n)}</button>` : ''}
      <button class="link" id="es-close">Cerrar</button>
    </div>
    <p class="meta" style="text-align:left">Versículos de la Reina-Valera 1909 (dominio público); el enlace abre la RVR1960.</p>`);
  $('#sheet-body').querySelectorAll('[data-sub]').forEach(b => b.onclick = () => escenarioSheet(k, b.dataset.sub));
  $('#es-orar').onclick = () => { closeSheet(); practicaRun({ k: 'esc_' + S.k, tipo: 'espiritu', n: `Oración: ${S.n}`, pasos: S.oracion, min: [Math.max(1, Math.round(S.oracion.reduce((a, p) => a + p[1], 0) / 60))] }, Math.max(1, Math.round(S.oracion.reduce((a, p) => a + p[1], 0) / 60))); };
  $('#es-mente')?.addEventListener('click', () => practicaSheet(mente));
  $('#es-close').onclick = closeSheet;
}

// Gratificación con evidencia (2.11.0). Lo que hace que valga la pena volver, sin trucos de casino:
// - Volver tras un fallo vale más: la intervención ganadora del megaestudio de Penn (Milkman et al., 2021, Nature).
// - Recompensa inmediata: lo que disfrutas al hacerlo, visible en el momento (Woolley y Fishbach, 2017).
// - Sorpresa acotada: a veces, sin aviso, unos XP extra; nunca resta, nunca se compra, como mucho dos al día
//   (Schultz, Dayan y Montague, 1997; Shen, Fishbach y Hsee, 2015). Lo inesperado no erosiona la motivación propia (Deci et al., 1999).
// - Elogio de la acción, no del rasgo (Mueller y Dweck, 1998); cierre del día con lo mejor (regla pico-final, Kahneman et al., 1993).
// - «Llevas» por debajo de la mitad y «te faltan» por encima (Koo y Fishbach, 2012).
// - Procrastinar es regular una emoción, no pereza (Sirois y Pychyl, 2013): achicar el paso y quitar la tentación (Steel, 2007).
// ====================================================================
window.xpSorpresa = () => {
  if ((dayOf().sorpresas || 0) >= 2 || Math.random() > 1 / 6) return;

  const prio = ES.prioridades.items.find(x => x.t === t), pr = prio?.pro ? ES.proyectos.find(p => p.id === prio.pro) : null;
  const hab = HT().habits.find(h => h.nombre === t);
  const obj = ES.objetivos.find(o => o.id === (src.obj || prio?.obj));
  return [src.por, src.exito && `Hecho cuando: ${src.exito}`, pr?.deseo && `${pr.nombre}: ${pr.deseo}`, pr?.resultado, hab?.disfrute && `Lo que disfrutas: ${hab.disfrute}`, ...(hab?.beneficios || []).slice(0, 2), obj && `Suma a «${obj.t}» (${obj.actual} de ${obj.meta} ${obj.unidad})`].filter(Boolean);
}
// Lo concreto que se está evitando: lo de la agenda para esta hora, la siguiente prioridad, un hábito o una tarea de hoy.
function loEvitado() {
  const ag = agendaAhora() || agItems().filter(it => !agHecho(it) && it.tipo !== 'evento').sort(agOrden)[0];
  if (ag) return ag.t;
  const prio = ES.prioridades.items.find(x => !x.hecho); if (prio) return prio.t;
  const p = pendientes(); return p.habits[0]?.nombre || p.due[0]?.titulo || '';
}
function procrastinoSheet() {
  const t = loEvitado();
  showSheet(`<h2>Estoy procrastinando</h2>
    <p class="sci">Procrastinar no es pereza: es evitar una emoción incómoda (Sirois y Pychyl, 2013). Lo que más ayuda es achicar el paso, recordar para qué y quitar la tentación (Steel, 2007). Elige una:</p>
    <div class="actions stack" style="margin-top:0">
      ${t ? `<button class="primary" id="pc-2">Hazlo más pequeño: 2 minutos de «${esc(t)}»</button>` : ''}
      <button class="outline" id="pc-por">Recuérdame para qué</button>
      <button class="outline" id="pc-hora">Ponle hora hoy</button>

  $('#pc-por').onclick = () => {

    showSheet(`<h2>Para qué</h2>${t ? `<p class="note">«${esc(t)}»</p>` : ''}
      ${razones.length ? `<ul class="pros">${razones.map(r => `<li>${esc(r)}</li>`).join('')}</ul>` : '<p class="note">Aún no le pusiste un para qué. Escríbelo en una línea: lo que cambia si lo haces hoy.</p>'}
      ${objs.length ? `<h3>Tus objetivos</h3><ul class="pros">${objs.map(o => `<li>${esc(o.t)} · ${esc(llevasFaltan(o.actual, o.meta, o.unidad))}</li>`).join('')}</ul>` : ''}
      <p class="meta">Imagina el final del día con esto hecho. Ahora, solo el primer paso.</p>
      <div class="actions stack">${t ? '<button class="primary" id="pc-2b">Empezar 2 minutos</button>' : ''}<button class="link" id="pc-x2">Cerrar</button></div>`);
    $('#pc-2b')?.addEventListener('click', () => { closeSheet(); startFocus(t, 2); });
    $('#pc-x2').onclick = closeSheet;
  };
  $('#pc-hora').onclick = () => { const it = t && agItems().find(x => x.t === t); if (it) agItemSheet(it); else { closeSheet(); irA('agenda'); organizarDia(); } };
  $('#pc-tel').onclick = () => { closeSheet(); focusForm(t, 25); };
  $('#pc-x').onclick = closeSheet;
}
// ---------- Cierre pico-final: termina el día con lo mejor, no con lo pendiente.
function cierreFinal(items) {
  const P = planManana();
  showSheet(`<div style="text-align:center"><p class="meta" style="margin:0">Lo mejor de hoy</p>
    <h2 style="margin:10px 0 12px;font-size:1.5rem">${esc(items[0])}</h2>
    ${items.length > 1 ? `<p class="meta">${items.slice(1).map(esc).join(' · ')}</p>` : ''}
    <p class="note">Buenas noches${nombre() ? ', ' + esc(nombre()) : ''}.${P ? ' Mañana ya está organizado.' : ''}</p>
    <div class="actions stack" style="align-items:center">${P ? '' : '<button class="primary" id="cf-man">Dejar mañana organizado · 2 min</button>'}<button class="${P ? 'primary' : 'link'}" id="cf-ok">Cerrar</button></div></div>`);
  $('#cf-man')?.addEventListener('click', organizarManana);
  $('#cf-ok').onclick = closeSheet;
}

// ====================================================================
// Notificaciones: llegan aunque la app esté cerrada. El teléfono se suscribe aquí (Web Push) y la
// tarea programada de GitHub (.github/workflows/notificaciones.yml) las envía con los datos de la cuenta.
// ====================================================================
const VAPID_PUBLIC = 'BCkSUFWA-q7GyyocviKZMTzTPNMvWGUNO-G_js0Y9zvBo5DtHoALCHHQIu5SoWc9ML1xaIO9JdPiP_DNG_FMito';
const AV_KEY = 'rumbo-avisos';
const AVISOS = [['manana', 'Resumen de la mañana', 'Prioridades, agenda, planes, hábitos, tareas y a quién escribir'], ['habitos', 'Hora de cada hábito', 'A la hora que pusiste en cada hábito, si aún no lo hiciste'],
  ['planes', 'Una hora antes de cada plan', 'Con una idea para la conversación'], ['proyectos', 'Paso de proyecto', 'A la hora que fijaste para el siguiente paso'], ['agenda', 'Agenda del día', '10 minutos antes de cada cosa con hora; a las 9:30, si el día no está organizado'],
  ['mediodia', 'Prioridad al mediodía', 'A la 1:00 PM, si tu prioridad sigue pendiente'], ['noche', 'Cierre del día', 'A las 9:00 PM: tu día en números y tres cosas buenas'], ['semana', 'Lunes y viernes', 'Revisión semanal y gracias del viernes']];
const avCfg = () => { try { return JSON.parse(localStorage.getItem(AV_KEY)) || {}; } catch { return {}; } };
const avSetCfg = c => { try { localStorage.setItem(AV_KEY, JSON.stringify(c)); } catch {} };
const b64u = t => { const b = atob((t + '='.repeat((4 - t.length % 4) % 4)).replace(/-/g, '+').replace(/_/g, '/')); return Uint8Array.from(b, c => c.charCodeAt(0)); };
async function avSuscribir(prefs) {
  if (!('serviceWorker' in navigator) || !('PushManager' in window) || !('Notification' in window)) throw new Error('Este navegador no admite notificaciones. Abre la app instalada desde Chrome.');
  if (!auth) throw new Error('Las notificaciones usan tu cuenta para saber qué avisarte. Crea una cuenta o inicia sesión en la pestaña Hábitos.');
  const permiso = await Notification.requestPermission();
  if (permiso !== 'granted') throw new Error('No diste permiso. Actívalo en Ajustes del teléfono → Aplicaciones → Organización Personal (o Chrome) → Notificaciones.');
  const reg = await navigator.serviceWorker.ready;
  const sub = await reg.pushManager.getSubscription() || await reg.pushManager.subscribe({ userVisibleOnly: true, applicationServerKey: b64u(VAPID_PUBLIC) });
  const j = sub.toJSON();
  if (!(await ensureToken())) throw new Error('Tu sesión caducó: vuelve a entrar en tu cuenta.');
  try {
    await supa('/rest/v1/push_subs', { method: 'POST', headers: { Prefer: 'resolution=merge-duplicates' },
      body: { endpoint: j.endpoint, user_id: auth.uid, p256dh: j.keys.p256dh, auth: j.keys.auth, tz: Intl.DateTimeFormat().resolvedOptions().timeZone, prefs } });
  } catch (e) { throw new Error(e.code === '42P01' || e.status === 404 ? 'Falta preparar la base de datos: pega push.sql en Supabase → SQL Editor.' : 'No se pudo guardar en tu cuenta: ' + e.message); }
}
async function avDesuscribir() {
  const reg = await navigator.serviceWorker?.ready, sub = await reg?.pushManager.getSubscription();
  if (sub) { try { if (await ensureToken()) await supa(`/rest/v1/push_subs?endpoint=eq.${encodeURIComponent(sub.endpoint)}`, { method: 'DELETE' }); } catch {} await sub.unsubscribe(); }
}
function avisosSheet() {
  const c = avCfg(), prefs = { hora: '07:30', ...c.prefs };
  showSheet(`<h2>Notificaciones</h2>
    <p class="note">La app te avisa aunque no la abras: lo importante te llega en una notificación y solo entras si quieres actuar.</p>
    <div class="set-row"><span>Activadas<small>${c.on ? 'En este teléfono' : 'Necesita tu cuenta (pestaña Hábitos)'}</small></span>
      <button class="${c.on ? 'link' : 'primary'}" id="av-on">${c.on ? 'Desactivar' : 'Activar'}</button></div>
    <div class="set-row"><span>Hora del resumen de la mañana</span><input id="av-hora" type="time" value="${esc(prefs.hora)}" style="width:auto"></div>
    <div class="rows">${AVISOS.map(([k, t, d]) => `<button class="row" data-k="${k}"><span class="box" style="${prefs[k] !== false ? 'background:var(--green);border-color:var(--green)' : ''}"></span>
      <span class="t"><div>${esc(t)}</div><small style="white-space:normal">${esc(d)}</small></span></button>`).join('')}</div>
    <p class="meta" style="margin-top:12px">Pueden llegar con unos minutos de retraso. Usan los datos sincronizados en tu cuenta y tu agenda de hoy si conectaste Google Calendar.</p>
    <p class="meta red" id="av-err"></p>
    <div class="actions">${c.on ? '<button class="link" id="av-test">Probar</button>' : ''}<button class="primary" id="av-ok">Listo</button></div>`);
  const guardarPrefs = async () => { prefs.hora = $('#av-hora').value || '07:30'; avSetCfg({ ...avCfg(), prefs }); if (avCfg().on) { try { await avSuscribir(prefs); } catch (e) { $('#av-err').textContent = e.message; } } };
  $('#sheet-body').querySelectorAll('[data-k]').forEach(b => b.onclick = () => {
    prefs[b.dataset.k] = prefs[b.dataset.k] === false; const x = b.querySelector('.box');
    x.style.background = prefs[b.dataset.k] ? 'var(--green)' : ''; x.style.borderColor = prefs[b.dataset.k] ? 'var(--green)' : '';
  });
  $('#av-on').onclick = async e => {
    e.target.disabled = true; $('#av-err').textContent = '';
    try {
      if (avCfg().on) { await avDesuscribir(); avSetCfg({ ...avCfg(), on: false }); }
      else { prefs.hora = $('#av-hora').value || '07:30'; await avSuscribir(prefs); avSetCfg({ ...avCfg(), on: true, prefs }); toast('Notificaciones activadas.'); }
      avisosSheet(); renderE();
    } catch (err) { $('#av-err').textContent = err.message; e.target.disabled = false; }
  };
  $('#av-test')?.addEventListener('click', async () => {
    const reg = await navigator.serviceWorker.ready;
    reg.showNotification('Organización Personal', { body: 'Así te llegarán los avisos. Puedes cerrar la app tranquilo.', icon: 'icon-192.png', badge: 'icon-192.png', tag: 'prueba' });
  });
  $('#av-ok').onclick = async () => { await guardarPrefs(); closeSheet(); };
}
