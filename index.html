// ---------- Tomar la iniciativa: personas, planes y proyectos
const daysSince = d => d ? Math.round((new Date(today() + 'T12:00') - new Date(d + 'T12:00')) / 864e5) : Infinity;
const fmtDias = n => n === Infinity ? 'sin registro' : n === 0 ? 'hoy' : n === 1 ? 'ayer' : `hace ${n} días`;
const addMin = (hhmm, m) => { const t = (toMin(hhmm) + m) % 1440; return `${String(Math.floor(t / 60)).padStart(2, '0')}:${String(t % 60).padStart(2, '0')}`; };
const cap = s => s ? s[0].toUpperCase() + s.slice(1) : s;
const fechaLarga = f => new Date(f + 'T12:00').toLocaleDateString('es', { weekday: 'long', day: 'numeric', month: 'long' });
// A quién le toca: cuanto más se pasó de la frecuencia que elegiste, antes sale.
function personasDue() {
  return ES.personas.map(p => ({ p, r: daysSince(p.ultimo) / p.cada })).filter(x => x.r >= 1).sort((a, b) => b.r - a.r).map(x => x.p);
}
const ultimoPaso = pr => pr.pasos.length ? pr.pasos[pr.pasos.length - 1].d : pr.creado;
const proyectosActivos = () => ES.proyectos.filter(p => !p.archivado).sort((a, b) => a.prioridad - b.prioridad || (ultimoPaso(a) < ultimoPaso(b) ? -1 : ultimoPaso(a) > ultimoPaso(b) ? 1 : 0));
const PRIO = { 1: 'Alta', 2: 'Media', 3: 'Baja' };
const planesProximos = () => ES.planes.filter(p => !p.hecho && p.fecha >= today()).sort((a, b) => (a.fecha + a.hora) < (b.fecha + b.hora) ? -1 : 1);
const planesSinCerrar = () => ES.planes.filter(p => !p.hecho && p.fecha < today());
// Semana de lunes a hoy.
const semanaKeys = () => { const back = wd(today()); return Array.from({ length: back + 1 }, (_, i) => dayKey(addDays(new Date(), i - back))); };
const iniciativasSemana = () => semanaKeys().reduce((a, k) => a + dayOf(k).iniciativas, 0);
// Predicción frente a resultado: cuánto más pesimista eres que la realidad.
function sesgo() {
  const xs = ES.predicciones.filter(x => x.real); if (!xs.length) return null;
  return { n: xs.length, d: xs.reduce((a, x) => a + x.real - x.pred, 0) / xs.length };
}
const sesgoTxt = b => b && b.n >= 1 ? (b.d > 0.2 ? `Tus predicciones fueron, de media, <b>${b.d.toFixed(1).replace('.', ',')} puntos más pesimistas</b> que la realidad (${b.n} ${b.n === 1 ? 'contacto' : 'contactos'}).` : b.d < -0.2 ? `La realidad fue ${(-b.d).toFixed(1).replace('.', ',')} puntos peor de lo que esperabas (${b.n}). Sigue: la media se ajusta con más contactos.` : `Tus predicciones aciertan con la realidad (${b.n}).`) : '';

function renderIni() {
  const due = personasDue(), prs = proyectosActivos(), prox = planesProximos(), cerrar = planesSinCerrar();
  const n = iniciativasSemana(), meta = ES.metaSemanal, rows = [];
  for (const pl of cerrar.slice(0, 1)) rows.push(`<button class="row" data-plan="${esc(pl.id)}"><span class="dot" style="--c:var(--amber)"></span>
    <span class="t"><div>¿Se hizo «${esc(cap(pl.titulo))}»?</div><small>${fmtFecha(pl.fecha)}${pl.con ? ' · con ' + esc(pl.con) : ''}</small></span><span class="tag">Cerrar</span></button>`);
  for (const p of ES.personas.filter(p => p.pred?.enviado).slice(0, 1)) rows.push(`<button class="row" data-per="${esc(p.id)}"><span class="dot" style="--c:var(--amber)"></span>
    <span class="t"><div>¿Cómo respondió ${esc(p.nombre)}?</div><small>Compara con lo que predijiste</small></span><span class="tag">Resultado</span></button>`);
  for (const p of due.filter(p => !p.pred?.enviado).slice(0, 2)) rows.push(`<button class="row" data-per="${esc(p.id)}"><span class="dot" style="--c:var(--green)"></span>
    <span class="t"><div>Escríbele a ${esc(p.nombre)}</div><small>Último contacto: ${fmtDias(daysSince(p.ultimo))}</small></span><span class="tag">Contacto</span></button>`);
  for (const pr of prs.slice(0, 2)) {
    const d = daysSince(ultimoPaso(pr));
    rows.push(`<button class="row" data-pro="${esc(pr.id)}"><span class="dot" style="--c:var(--accent)"></span>
      <span class="t"><div>${esc(pr.paso || 'Define el siguiente paso')}</div><small>${esc(pr.nombre)}${pr.cuando ? ` · ${fmtFecha(pr.cuando)}${pr.hora ? ' ' + fmtHora(pr.hora) : ''}` : ''}${d >= 7 ? ` · <span class="amber">sin avanzar ${fmtDias(d)}</span>` : ''}</small></span><span class="tag">${pr.prioridad === 1 ? 'Prioridad alta' : 'Proyecto'}</span></button>`);
  }
  const mi = misionHoy(), hecha = ES.misiones.some(x => x.d === today());
  rows.push(`<button class="row" data-man="mision"><span class="dot" style="--c:${hecha ? 'var(--empty)' : 'var(--green)'}"></span>
    <span class="t"><div style="${hecha ? 'text-decoration:line-through;color:var(--muted)' : ''}">${esc(mi.t)}</div><small>${reto7Dia() ? `Reto de desconocidos · día ${reto7Dia()} de 7` : 'Misión social de hoy'}</small></span><span class="tag">${hecha ? 'Hecha' : 'Misión'}</span></button>`);
  const L = laboralSemana(), lh = L.items.filter(x => x.hecho).length;
  rows.push(`<button class="row" data-man="laboral"><span class="dot" style="--c:var(--text)"></span>
    <span class="t"><div>Iniciativa laboral de la semana</div><small>Una propuesta, una reunión, un problema anticipado</small></span><span class="tag">${lh} de 3</span></button>`);
  for (const pl of prox.slice(0, 2)) rows.push(`<button class="row" data-plan="${esc(pl.id)}"><span class="dot" style="--c:var(--muted)"></span>
    <span class="t"><div>${esc(cap(pl.titulo))}${pl.con ? ' con ' + esc(pl.con) : ''}</div><small>${fmtFecha(pl.fecha)} · ${fmtHora(pl.hora)}</small></span><span class="tag">Plan</span></button>`);
  const hoyD = new Date(), nuevo = (wd(today()) === 0 || hoyD.getDate() === 1) && ES.revision !== today();
  const revisionRow = nuevo || wd(today()) === 6 ? `<button class="row" data-man="revision"><span class="dot" style="--c:var(--accent)"></span>
    <span class="t"><div>${nuevo ? 'Nuevo comienzo: revisión semanal' : 'Revisión semanal'}</div><small>10 minutos: logros, siguientes pasos y bloques de la semana</small></span><span class="tag">${hoyD.getDate() === 1 ? 'Mes nuevo' : wd(today()) === 0 ? 'Lunes' : 'Domingo'}</span></button>` : '';
  if (revisionRow) rows.unshift(revisionRow);
  $('#ini').innerHTML = `
    <div class="meter"><span>Iniciativas esta semana</span><b>${n} de ${meta}</b></div>
    <div class="meter-bar"><i style="width:${Math.min(100, n / meta * 100)}%"></i></div>
    ${rows.length ? `<div class="rows">${rows.join('')}</div>` : `<p class="empty">Añade a las personas con las que quieres mantener el contacto y tus proyectos. Aquí aparecerá, cada día, a quién escribir y el siguiente paso de cada proyecto.</p>`}
    <p class="more"><button class="link" data-man="revision">Revisión semanal</button> · <button class="link" data-man="personas">Personas (${ES.personas.length})</button> · <button class="link" data-man="proyectos">Proyectos (${prs.length})</button> · <button class="link" data-man="plan">Proponer un plan</button></p>`;
}
$('#ini').addEventListener('click', e => {
  const b = e.target.closest('[data-per],[data-pro],[data-plan],[data-man]'); if (!b) return;
  if (b.dataset.per) personaSheet(ES.personas.find(p => p.id === b.dataset.per));
  if (b.dataset.pro) proyectoSheet(ES.proyectos.find(p => p.id === b.dataset.pro));
  if (b.dataset.plan) planSheet(ES.planes.find(p => p.id === b.dataset.plan));
  if (b.dataset.man === 'personas') personasManager();
  if (b.dataset.man === 'proyectos') proyectosManager();
  if (b.dataset.man === 'plan') planForm();
  if (b.dataset.man === 'revision') revisionSemanal();
  if (b.dataset.man === 'mision') misionSheet();
  if (b.dataset.man === 'laboral') laboralSheet();
});

// Personas
function registrar(p, tipo) {
  const t = today(), repetido = p.historial.some(h => h.d === t && h.tipo === tipo);
  p.ultimo = t;
  if (p.pred && !p.pred.enviado) p.pred.enviado = true;
  if (!repetido) { p.historial.push({ d: t, tipo }); p.historial = p.historial.slice(-30); bump('iniciativas'); }
  guardar(); renderE();
}
function personasManager() {
  const list = [...ES.personas].sort((a, b) => daysSince(b.ultimo) / b.cada - daysSince(a.ultimo) / a.cada);
  showSheet(`<h2>Personas</h2>
    <p class="sci">Las personas a las que escribes valoran tu mensaje más de lo que crees, sobre todo si es inesperado (Liu et al., 2023). Elige con quién quieres mantener el contacto y en qué círculo está.</p>
    ${sesgo() ? `<p class="meta">${sesgoTxt(sesgo())}</p>` : ''}
    <div class="rows">${list.map(p => `<button class="row" data-p="${esc(p.id)}"><span class="dot" style="--c:${daysSince(p.ultimo) >= p.cada ? 'var(--green)' : 'var(--empty)'}"></span>
      <span class="t"><div>${esc(p.nombre)}</div><small>${CADA[p.cada] || ''} · último contacto ${fmtDias(daysSince(p.ultimo))}${p.horas ? ' · ' + fmtHoras(p.horas) + ' juntos' : ''}</small></span></button>`).join('')}</div>
    ${list.length ? '' : '<p class="empty">Aún no hay nadie.</p>'}
    <div class="actions"><button class="link" id="pm-close">Cerrar</button><button class="primary" id="pm-add">Añadir persona</button></div>`);
  $('#sheet-body').querySelectorAll('[data-p]').forEach(b => b.onclick = () => personaSheet(ES.personas.find(p => p.id === b.dataset.p)));
  $('#pm-add').onclick = () => personaForm();
  $('#pm-close').onclick = closeSheet;
}
function personaForm(p = null) {
  showSheet(`<h2>${p ? 'Editar' : 'Añadir'} persona</h2>
    <div class="field"><label>Nombre</label><input id="pf-n" maxlength="40" value="${esc(p?.nombre)}" placeholder="Ana"></div>
    <div class="field"><label>Teléfono con código de país (opcional)</label><input id="pf-t" inputmode="tel" value="${esc(p?.tel)}" placeholder="58 412 1234567"></div>
    <div class="field"><label>Círculo y frecuencia de contacto</label><select id="pf-c">${Object.entries(CADA).map(([k, v]) => `<option value="${k}" ${+k === (p?.cada || 30) ? 'selected' : ''}>${v}</option>`).join('')}</select></div>
    <div class="actions">${p ? '<button class="link red" id="pf-del">Eliminar</button>' : ''}<button class="link" id="pf-cancel">Cancelar</button><button class="primary" id="pf-ok">Guardar</button></div>`);
  $('#pf-n').focus();
  $('#pf-cancel').onclick = () => p ? personaSheet(p) : personasManager();
  $('#pf-del')?.addEventListener('click', () => { forget(p.id); ES.personas = ES.personas.filter(x => x !== p); guardar(); renderE(); personasManager(); });
  $('#pf-ok').onclick = () => {
    const nombre = $('#pf-n').value.trim(); if (!nombre) { $('#pf-n').focus(); return; }
    const data = { nombre, tel: $('#pf-t').value.trim(), cada: +$('#pf-c').value };

    guardar(); renderE(); personaSheet(p);
  };
}
function personaSheet(p) {
  if (!p) return;
  const tel = p.tel.replace(/\D/g, '');
  if (p.pred?.enviado) {
    showSheet(`<h2>¿Cómo respondió ${esc(p.nombre)}?</h2>
      <p class="note">Predijiste que lo valoraría un ${p.pred.v} de 7. ¿Cuánto lo valoró de verdad?</p>

      <div class="actions"><button class="link" id="pr-skip">Aún no respondió</button></div>`);
    $('#pr-real').addEventListener('click', e => {
      const c = e.target.closest('.chip'); if (!c) return;
      ES.predicciones.push({ id: crypto.randomUUID(), d: today(), quien: p.nombre, pred: p.pred.v, real: +c.dataset.v }); ES.predicciones = ES.predicciones.slice(-200);
      delete p.pred; guardar(); renderE();

  showSheet(`<h2>${esc(p.nombre)}</h2>
    <p class="note">Último contacto: ${fmtDias(daysSince(p.ultimo))} · ${CADA[p.cada] || ''}.</p>
    <p class="sci">Quien recibe un mensaje inesperado lo valora más de lo que predice quien lo envía (Liu et al., 2023), y agradecer causa más alegría de la que imaginamos (Kumar y Epley, 2018).</p>
    <div class="field"><label>Mensaje</label><div class="chips" id="pe-tpl" style="margin-bottom:8px">${Object.keys(PLANTILLAS).map((k, i) => `<button class="chip${i ? '' : ' on'}" data-t="${k}">${k}</button>`).join('')}</div>
      <textarea id="pe-txt" style="min-height:84px">${esc(PLANTILLAS.Saludo(p.nombre))}</textarea></div>
    <div class="field"><label>Antes de enviarlo: ¿cuánto crees que lo valorará? (1–7)</label>
      <div class="chips" id="pe-pred">${[1, 2, 3, 4, 5, 6, 7].map(n => `<button class="chip${p.pred?.v === n ? ' on' : ''}" data-v="${n}">${n}</button>`).join('')}</div></div>
    <div class="actions stack" style="margin-top:0">
      <a class="primary btn" href="#" target="_blank" rel="noopener" id="pe-wa">Enviar por WhatsApp</a>
      ${tel ? `<a class="outline btn" href="tel:+${tel}" data-log="Llamada">Llamar</a>` : ''}
      <button class="outline" id="pe-plan">Proponer un plan</button>
    </div>
    <div class="field" style="margin-top:22px"><label>Registrar lo que hiciste</label><div class="chips">${TIPOS.map(t => `<button class="chip" data-reg="${t}">${t}</button>`).join('')}</div></div>
    <div class="field"><label>Tiempo juntos: ${fmtHoras(p.horas)} ${horasMeta(p.horas)}</label><div class="chips" id="pe-h">${[0.5, 1, 2, 3].map(h => `<button class="chip" data-h="${h}">+${String(h).replace('.', ',')} h</button>`).join('')}</div></div>
    ${p.historial.length ? `<p class="meta">${p.historial.slice(-4).reverse().map(h => `${esc(h.tipo)} · ${fmtFecha(h.d)}`).join('<br>')}</p>` : ''}
    <div class="actions"><button class="link" id="pe-edit">Editar</button><button class="link" id="pe-all">Todas las personas</button></div>`);
  const body = $('#sheet-body');
  let tipo = 'Saludo';
  const wa = () => { $('#pe-wa').href = `https://wa.me/${tel}?text=${encodeURIComponent($('#pe-txt').value)}`; };
  wa(); $('#pe-txt').addEventListener('input', wa);
  $('#pe-tpl').addEventListener('click', e => {
    const c = e.target.closest('.chip'); if (!c) return; tipo = c.dataset.t;
    $('#pe-tpl').querySelectorAll('.chip').forEach(x => x.classList.toggle('on', x === c));
    $('#pe-txt').value = PLANTILLAS[tipo](p.nombre); wa();
  });
  $('#pe-pred').addEventListener('click', e => {
    const c = e.target.closest('.chip'); if (!c) return;
    p.pred = { v: +c.dataset.v, d: today(), enviado: false }; guardar();
    $('#pe-pred').querySelectorAll('.chip').forEach(x => x.classList.toggle('on', x === c));
  });
  $('#pe-wa').addEventListener('click', () => { registrar(p, tipo === 'Gracias' ? 'Gracias' : tipo === 'Plan' ? 'Plan' : 'Mensaje'); toast('Registrado. Bien por escribir primero.'); });
  body.querySelectorAll('[data-log]').forEach(a => a.addEventListener('click', () => { registrar(p, a.dataset.log); toast('Registrado. Bien por tomar la iniciativa.'); }));
  body.querySelectorAll('[data-reg]').forEach(b => b.onclick = () => { registrar(p, b.dataset.reg); closeSheet(); buzz(20); toast(`${b.dataset.reg} con ${p.nombre}: registrado.`); });
  $('#pe-plan').onclick = () => planForm(p.nombre);
  $('#pe-h').addEventListener('click', e => { const c = e.target.closest('.chip'); if (!c) return; p.horas = (+p.horas || 0) + +c.dataset.h; p.ultimo = today(); guardar(); renderE(); personaSheet(p); toast('Tiempo juntos registrado.'); });
  $('#pe-edit').onclick = () => personaForm(p);
  $('#pe-all').onclick = personasManager;
}

// Planes
function planForm(con = '') {
  const man = dayKey(addDays(new Date(), 1));
  showSheet(`<h2>Proponer un plan</h2>
    <p class="sci">Predecimos que hablar con otros será más incómodo y menos agradable de lo que resulta (Epley y Schroeder, 2014). Quien propone día y hora es quien hace que el plan ocurra.</p>
    <div class="field"><label>¿Qué?</label><input id="pl-t" maxlength="60" placeholder="tomar un café">
      <div class="chips" style="margin-top:10px" id="pl-ideas">${PLAN_IDEAS.map(i => `<button class="chip" data-i="${esc(i)}">${esc(cap(i))}</button>`).join('')}</div></div>
    <div class="field"><label>¿Con quién?</label><input id="pl-c" maxlength="40" value="${esc(con)}" list="pl-people" placeholder="Nombre">
      <datalist id="pl-people">${ES.personas.map(p => `<option value="${esc(p.nombre)}">`).join('')}</datalist></div>
    <div class="times"><div class="field"><label>Fecha</label><input id="pl-f" type="date" value="${man}" min="${today()}"></div>
      <div class="field"><label>Hora</label><input id="pl-h" type="time" value="18:00"></div></div>
    <div class="actions"><button class="link" id="pl-cancel">Cancelar</button><button class="primary" id="pl-ok">Guardar plan</button></div>`);
  $('#pl-ideas').addEventListener('click', e => { const c = e.target.closest('.chip'); if (c) $('#pl-t').value = c.dataset.i; });
  $('#pl-cancel').onclick = closeSheet;
  $('#pl-ok').onclick = () => {
    const titulo = $('#pl-t').value.trim(), fecha = $('#pl-f').value, hora = $('#pl-h').value || '18:00';
    if (!titulo) { $('#pl-t').focus(); return; }
    if (!fecha) { $('#pl-f').focus(); return; }
    const pl = { id: crypto.randomUUID(), titulo, con: $('#pl-c').value.trim(), fecha, hora, hecho: false };
    ES.planes.push(pl);
    const per = ES.personas.find(p => p.nombre.toLowerCase() === pl.con.toLowerCase());
    if (per) registrar(per, 'Plan'); else { bump('iniciativas'); guardar(); renderE(); }
    planSheet(pl, true);
  };
}
function planSheet(pl, nuevo = false) {
  if (!pl) return;
  const per = ES.personas.find(p => p.nombre.toLowerCase() === (pl.con || '').toLowerCase());
  const tel = per?.tel.replace(/\D/g, '') || '';
  const texto = `Hola${pl.con ? `, ${pl.con}` : ''}. ¿Te animas a ${pl.titulo} el ${fechaLarga(pl.fecha)} a las ${fmtHora(pl.hora)}?`;
  const ini = pl.fecha.replaceAll('-', '') + 'T' + pl.hora.replace(':', '') + '00';
  const finD = new Date(`${pl.fecha}T${pl.hora}`); finD.setHours(finD.getHours() + 1);
  const fin = dayKey(finD).replaceAll('-', '') + 'T' + String(finD.getHours()).padStart(2, '0') + String(finD.getMinutes()).padStart(2, '0') + '00';
  const cal = `https://calendar.google.com/calendar/render?action=TEMPLATE&text=${encodeURIComponent(cap(pl.titulo) + (pl.con ? ' con ' + pl.con : ''))}&dates=${ini}/${fin}`;
  const pasado = pl.fecha < today();
  showSheet(`<h2>${esc(cap(pl.titulo))}${pl.con ? ' con ' + esc(pl.con) : ''}</h2>
    <p class="note">${cap(fechaLarga(pl.fecha))} · ${fmtHora(pl.hora)}${nuevo ? '. Ahora, envía la invitación y apártalo en el calendario.' : ''}</p>
    ${pasado ? `<p style="margin:0 0 12px">¿Se hizo?</p><div class="chips"><button class="chip" data-done="si">Sí</button><button class="chip" data-done="no">No, se canceló</button></div>` : `
    <div class="actions stack" style="margin-top:0">
      <a class="primary btn" href="https://wa.me/${tel}?text=${encodeURIComponent(texto)}" target="_blank" rel="noopener">Enviar invitación por WhatsApp</a>
      <a class="outline btn" href="${cal}" target="_blank" rel="noopener">Añadir a Google Calendar</a>
    </div>
    <h3>Para la conversación</h3>
    <ul class="pros">${[...PREGUNTAS].sort(() => Math.random() - .5).slice(0, 2).map(q => `<li>${esc(q)}</li>`).join('')}${[...PREGUNTAS_ARON].sort(() => Math.random() - .5).slice(0, 1).map(q => `<li>${esc(q)} <span class="meta">(Aron et al., 1997)</span></li>`).join('')}</ul>
    <p class="meta">Pasa pronto de lo superficial a lo profundo: resulta menos incómodo de lo que crees (Kardas et al., 2022). Haz preguntas de seguimiento y, ante una buena noticia, responde con entusiasmo y pregunta más (Gable et al., 2004).</p>`}
    <div class="actions"><button class="link red" id="ps-del">Eliminar</button><button class="link" id="ps-close">Cerrar</button></div>`);
  $('#sheet-body').querySelectorAll('[data-done]').forEach(b => b.onclick = () => {
    pl.hecho = true; pl.resultado = b.dataset.done; guardar(); renderE();
    showSheet(b.dataset.done === 'si'
      ? `<h2>Plan cumplido</h2><p class="note">Probablemente le caíste mejor de lo que piensas: después de conversar, casi todos subestimamos cuánto le gustamos a la otra persona (Boothby et al., 2018).</p>
        <div class="actions stack"><button class="primary" id="pd-next">Proponer el siguiente encuentro</button><button class="link" id="pd-close">Cerrar</button></div>`
      : `<h2>Se canceló</h2><p class="note">Pasa. Lo que cuenta es volver a proponerlo, con día y hora.</p>
        <div class="actions stack"><button class="primary" id="pd-next">Proponer otra fecha</button><button class="link" id="pd-close">Cerrar</button></div>`);
    $('#pd-next').onclick = () => planForm(pl.con);
    $('#pd-close').onclick = closeSheet;
  });
  $('#ps-del').onclick = () => { forget(pl.id); ES.planes = ES.planes.filter(x => x !== pl); guardar(); renderE(); closeSheet(); };
  $('#ps-close').onclick = closeSheet;
}

// Proyectos: WOOP (deseo, resultado, obstáculo, plan si-entonces) y un siguiente paso siempre visible.
function proyectosManager() {
  const list = proyectosActivos(), arch = ES.proyectos.filter(p => p.archivado);
  showSheet(`<h2>Proyectos</h2>
    <p class="sci">Cada proyecto vive de su siguiente paso: una acción física de menos de 25 minutos. Registrar los avances pequeños es lo que más sostiene la motivación (Amabile y Kramer, 2011).</p>
    <div class="rows">${list.map(p => { const d = daysSince(ultimoPaso(p)); return `<button class="row" data-p="${esc(p.id)}"><span class="dot" style="--c:${d >= 7 ? 'var(--amber)' : 'var(--accent)'}"></span>
      <span class="t"><div>${esc(p.nombre)}</div><small>Prioridad ${PRIO[p.prioridad].toLowerCase()} · ${esc(p.paso || 'Sin siguiente paso')} · ${p.pasos.length} ${p.pasos.length === 1 ? 'paso' : 'pasos'}</small></span></button>`; }).join('')}</div>
    ${list.length ? '' : '<p class="empty">Aún no hay proyectos.</p>'}
    ${arch.length ? `<p class="meta" style="margin-top:12px">Terminados o archivados: ${arch.map(p => esc(p.nombre)).join(', ')}</p>` : ''}
    <div class="actions"><button class="link" id="prm-close">Cerrar</button><button class="primary" id="prm-add">Nuevo proyecto</button></div>`);
  $('#sheet-body').querySelectorAll('[data-p]').forEach(b => b.onclick = () => proyectoSheet(ES.proyectos.find(p => p.id === b.dataset.p)));
  $('#prm-add').onclick = () => proyectoForm();
  $('#prm-close').onclick = closeSheet;
}

    <div class="field"><label>Proyecto</label><input id="pr-n" maxlength="60" value="${esc(pr?.nombre)}" placeholder="Lanzar mi web"></div>

  $('#pr-cancel').onclick = () => pr ? proyectoSheet(pr) : proyectosManager();

  $('#ps-edit2')?.addEventListener('click', () => proyectoForm(pr));

function pasoHecho(pr) {
  if (!pr) return;
  showSheet(`<h2>Pequeña victoria</h2>
    <p class="note">«${esc(pr.paso)}» queda hecho. Cada paso registrado cuenta como una iniciativa.</p>
    <div class="field"><label>¿Cuál es el siguiente paso?</label><input id="ph-s" maxlength="100" placeholder="Una acción física de menos de 25 minutos"></div>
    ${pasoCampos(null)}
    <div class="actions"><button class="link" id="ph-cancel">Cancelar</button><button class="primary" id="ph-ok">Guardar</button></div>`);
  $('#ph-s').focus();
  $('#ph-cancel').onclick = () => proyectoSheet(pr);
  $('#ph-ok').onclick = () => {
    pr.pasos.push({ t: pr.paso, d: today() }); pr.pasos = pr.pasos.slice(-200);
    pr.paso = $('#ph-s').value.trim(); Object.assign(pr, leerPaso()); pr.nota = '';
    bump('pasos'); bump('iniciativas'); guardar(); renderE(); buzz([30, 60, 30]);
    proyectoSheet(pr); toast('Avance registrado.');
  };
}

// Día, hora y lugar del siguiente paso: el plan «si…, entonces…» con fecha y hora concretas.
function pasoCampos(pr) {
  return `<div class="times"><div class="field"><label>¿Qué día?</label><input id="pp-c" type="date" value="${esc(pr?.cuando)}"></div>
      <div class="field"><label>¿A qué hora?</label><input id="pp-h" type="time" value="${esc(pr?.hora)}"></div></div>
    <div class="field"><label>¿Dónde?</label><input id="pp-d" maxlength="60" value="${esc(pr?.donde)}" placeholder="En mi escritorio"></div>
    <div class="field"><label>Versión de 2 minutos (para los días difíciles)</label><input id="pp-m" maxlength="100" value="${esc(pr?.minima)}" placeholder="Abrir el documento y escribir el título"></div>`;
}
const leerPaso = () => ({ cuando: $('#pp-c').value, hora: $('#pp-h').value, donde: $('#pp-d').value.trim(), minima: $('#pp-m').value.trim() });
function calUrl(texto, fecha, hora, mins, lugar = '') {
  const a = new Date(`${fecha}T${hora}`), b = new Date(a.getTime() + mins * 60000);
  const f = d => dayKey(d).replaceAll('-', '') + 'T' + String(d.getHours()).padStart(2, '0') + String(d.getMinutes()).padStart(2, '0') + '00';
  return `https://calendar.google.com/calendar/render?action=TEMPLATE&text=${encodeURIComponent(texto)}&dates=${f(a)}/${f(b)}${lugar ? '&location=' + encodeURIComponent(lugar) : ''}`;
}
// «Estoy procrastinando»: nombrar la emoción, reformular el pensamiento y empezar por 2 minutos (TCC + autocompasión).
const TRABAS = {
  'Miedo a hacerlo mal': 'Cambia «tiene que quedar perfecto» por «solo un borrador feo». Lo feo se corrige; lo que no existe, no.',
  'No sé por dónde empezar': 'Eso indica que el paso es demasiado grande. Escribe la acción física más pequeña: abrir el archivo, escribir un título.',
  'Aburrimiento': 'Liga la tarea a algo que disfrutes solo mientras la haces (música, un café) y ponle un tope de 10 minutos.',
  'Cansancio': 'Haz la versión de 2 minutos. Actuar según el plan, no según el ánimo, suele subir la energía al empezar.',
  'Me siento abrumado': 'Elige una sola cosa. Todo lo demás puede esperar 10 minutos.',
};
function procrastinando(pr) {
  showSheet(`<h2>Estoy procrastinando</h2>
    <p class="note">Le pasa a todo el mundo. Perdonarte la última vez reduce la procrastinación en la siguiente (Wohl et al., 2010). ¿Qué sientes ahora?</p>
    <div class="rows">${Object.keys(TRABAS).map(t => `<button class="row" data-t="${esc(t)}"><span class="box"></span><span class="t"><div>${esc(t)}</div></span></button>`).join('')}</div>
    <div class="actions"><button class="link" id="pc-close">Cerrar</button></div>`);
  $('#pc-close').onclick = () => proyectoSheet(pr);
  $('#sheet-body').querySelectorAll('[data-t]').forEach(b => b.onclick = () => {
    showSheet(`<h2>${esc(b.dataset.t)}</h2>
      <p style="margin:0 0 14px">${esc(TRABAS[b.dataset.t])}</p>
      <p class="sci">Las intervenciones basadas en terapia cognitivo-conductual son las que más reducen la procrastinación (Rozental et al., 2018; van Eerde y Klingsieck, 2018).</p>
      <div class="field"><label>Lo más pequeño que puedes hacer ahora</label><input id="pc-min" maxlength="100" value="${esc(pr.minima || pr.paso)}"></div>
      <div class="actions stack"><button class="primary" id="pc-go">Empezar 2 minutos</button><button class="link" id="pc-back">Volver</button></div>`);
    $('#pc-go').onclick = () => { closeSheet(); startFocus($('#pc-min').value.trim() || pr.paso, 2, pr.id); };
    $('#pc-back').onclick = () => procrastinando(pr);

}
// Revisión semanal: logros, proyectos sin siguiente paso y bloques para la semana. Los lunes y el día 1 se ofrece sola.
function revisionSemanal() {
  ES.revision = today(); guardar();
  const ks = Array.from({ length: 7 }, (_, i) => dayKey(addDays(new Date(), i - 6)));
  const sum = f => ks.reduce((a, k) => a + dayOf(k)[f], 0);
  const victorias = ES.proyectos.flatMap(p => p.pasos.filter(x => ks.includes(x.d)).map(x => ({ ...x, p: p.nombre })));
  const prs = proyectosActivos(), sinPaso = prs.filter(p => !p.paso), sinFecha = prs.filter(p => p.paso && !p.cuando);
  const reporte = `Mi semana: ${fmtMin(sum('enfoque'))} de enfoque, ${sum('iniciativas')} iniciativas, ${victorias.length} pasos en proyectos${victorias.length ? ` (${victorias.slice(-3).map(v => v.t).join('; ')})` : ''}. Esta semana me comprometo a: ${prs.filter(p => p.paso).slice(0, 3).map(p => p.paso).join('; ') || '…'}.`;
  showSheet(`<h2>Revisión semanal</h2>
    <p class="note">Los comienzos (un lunes, un mes nuevo) son buen momento para retomar metas (Dai et al., 2014). Diez minutos bastan.</p>
    <h3 style="margin-top:8px">1. Lo que lograste</h3>
    <p class="meta">${fmtMin(sum('enfoque'))} de enfoque · ${sum('iniciativas')} iniciativas · ${victorias.length} pasos · resististe ${sum('resistidas') + sum('alternativas')} veces</p>
    ${victorias.length ? `<ul class="pros">${victorias.slice(-6).map(v => `<li>${esc(v.t)} <span class="meta">· ${esc(v.p)}</span></li>`).join('')}</ul>` : ''}
    <h3>2. Siguientes pasos</h3>
    ${sinPaso.length || sinFecha.length ? `<div class="rows">${[...sinPaso, ...sinFecha].map(p => `<button class="row" data-p="${esc(p.id)}"><span class="dot" style="--c:var(--amber)"></span><span class="t"><div>${esc(p.nombre)}</div><small>${p.paso ? 'Ponle día y hora' : 'Sin siguiente paso'}</small></span></button>`).join('')}</div>` : '<p class="meta">Cada proyecto tiene paso con día y hora.</p>'}
    <h3>3. Prioridades</h3>
    <p class="meta">Ordena tus proyectos por prioridad: solo uno o dos en «Alta». ${prs.filter(p => p.prioridad === 1).length > 2 ? '<span class="amber">Ahora tienes ' + prs.filter(p => p.prioridad === 1).length + ' en alta: elige.</span>' : ''}</p>
    <h3>4. Personas</h3>
    <p class="meta">${personasDue().length ? `Te toca escribir a ${personasDue().slice(0, 4).map(p => esc(p.nombre)).join(', ')}.` : 'Estás al día con tus círculos.'} Meta: ${ES.metaSemanal} iniciativas esta semana.</p>
    <h3>5. Pacto de la semana</h3>
    <p class="meta">Un compromiso previo, con consecuencia que tú eliges, hace más caro saltarse el límite (Bryan, Karlan y Nelson, 2010).</p>
    <div class="field"><input id="rv-pacto" maxlength="160" value="${esc(ES.pacto.semana === lunes() ? ES.pacto.texto : '')}" placeholder="Máximo ${ES.presupuesto} min al día de redes; si lo rompo, invito el café"></div>
    <h3>6. Compártelo</h3>
    <p class="meta">Hacer público el progreso aumenta su efecto (Harkin et al., 2016).</p>
    <div class="actions stack"><a class="outline btn" target="_blank" rel="noopener" id="rv-wa" href="#">Enviar mi reporte y mi pacto por WhatsApp</a><button class="primary" id="rv-ok">Listo</button></div>`);
  const pacto = () => { const t = $('#rv-pacto').value.trim(); ES.pacto = { semana: lunes(), texto: t }; guardar(); return t; };
  const wa = () => { const t = $('#rv-pacto').value.trim(); $('#rv-wa').href = `https://wa.me/?text=${encodeURIComponent(reporte + (t ? ` Mi pacto: ${t}.` : ''))}`; };
  wa(); $('#rv-pacto').addEventListener('input', wa); $('#rv-wa').addEventListener('click', pacto);
  $('#sheet-body').querySelectorAll('[data-p]').forEach(b => b.onclick = () => proyectoForm(ES.proyectos.find(p => p.id === b.dataset.p)));
  $('#rv-ok').onclick = () => { pacto(); closeSheet(); renderE(); };

// ---------- Emociones detrás del impulso (Throuvala et al., 2020): nombrarlas ayuda a regularlas.
const EMOCIONES = ['Aburrimiento', 'Ansiedad', 'Soledad', 'Cansancio', 'Curiosidad', 'Evitar algo'];
const EMO_TIP = {
  Aburrimiento: 'El aburrimiento pide novedad: una alternativa de 5 minutos también la da.',
  Ansiedad: 'El feed no baja la ansiedad, la alimenta. Prueba respirar con el círculo.',
  Soledad: 'Mirar a otros no acompaña; escribirle a alguien, sí.',
  Cansancio: 'Si estás cansado, descansa de verdad: ojos cerrados 3 minutos.',
  Curiosidad: 'Anota qué querías ver y búscalo en tu ventana de revisión.',
  'Evitar algo': '¿Qué estás evitando? La versión de 2 minutos suele bastar para empezar.',
};
const emociones = () => {
  const c = {};
  for (const d of Object.values(ES.dias)) for (const [k, v] of Object.entries(d)) if (k.startsWith('emo_')) c[k.slice(4)] = (c[k.slice(4)] || 0) + v;
  return Object.entries(c).sort((a, b) => b[1] - a[1]);
};
// ---------- Ánimo antes y después de una sesión (activación conductual): actuar suele subir el ánimo.
const animoTxt = () => { const xs = ES.animo.filter(x => x.antes && x.despues); if (!xs.length) return ''; const d = xs.reduce((a, x) => a + x.despues - x.antes, 0) / xs.length;
  return `Tu ánimo ${d >= 0 ? 'sube' : 'baja'} de media ${Math.abs(d).toFixed(1).replace('.', ',')} puntos al terminar una sesión (${xs.length}).`; };
// ---------- Reto de 21 días con el presupuesto: los cambios de menos de una semana no bastan.
const retoDia = () => Math.max(1, daysSince(ES.retoInicio) + 1);
// ---------- Semana (lunes) para el pacto y la iniciativa laboral.
const lunes = () => dayKey(addDays(new Date(), -wd(today())));
// ---------- Horas juntos (Hall, 2019): ~50 h para una amistad casual, ~90 para amigos, ~200 para buenos amigos.
const fmtHoras = h => `${String(Math.round(h * 10) / 10).replace('.', ',')} h`;
const horasMeta = h => h >= 200 ? '· buen amigo' : h >= 90 ? `· amigo, hacia 200 h` : h >= 50 ? `· amistad casual, hacia 90 h` : `· hacia 50 h`;
// ---------- Misión social del día: un reto de 7 días con desconocidos (Sandstrom et al., 2022) o una conducta de las que más bienestar dan (Hall et al., 2023).
const MISIONES_DESCONOCIDOS = ['Saluda y pregúntale algo a alguien en una fila o en el transporte.', 'Habla con alguien que lleve algo que te llame la atención y díselo.', 'Pregúntale a un vendedor o barista cómo va su día, y escucha la respuesta.', 'Pídele una recomendación (libro, comida, lugar) a un desconocido.', 'Haz un cumplido sincero a alguien que no conoces.', 'Inicia una conversación con alguien que tenga un perro o un niño.', 'Habla con alguien nuevo en el trabajo, el gimnasio o la universidad.'];
const MISIONES_DIA = ['Ponte al día con un amigo: pregúntale por algo que te contó la última vez.', 'Haz un cumplido concreto a alguien cercano.', 'Escucha a alguien sin mirar el teléfono ni interrumpir.', 'Comparte algo tuyo que normalmente no cuentas.', 'Haz reír a alguien: comparte algo divertido.', 'Dile a alguien por qué lo valoras.', 'Pregúntale a alguien cómo puedes ayudarle esta semana.'];
const reto7Dia = () => { if (!ES.reto7.inicio) return 0; const n = daysSince(ES.reto7.inicio) + 1; return n >= 1 && n <= 7 ? n : 0; };
const misionHoy = () => { const n = reto7Dia(); return n ? { t: MISIONES_DESCONOCIDOS[n - 1], tipo: 'desconocido' } : { t: MISIONES_DIA[(daysSince('2026-01-05') % 7 + 7) % 7], tipo: 'cercano' }; };
function misionSheet() {
  const mi = misionHoy(), hoyM = ES.misiones.find(x => x.d === today());
  const xs = ES.misiones.filter(x => x.tipo === 'desconocido' && x.abierto !== undefined), abiertos = xs.filter(x => x.abierto).length;
  showSheet(`<h2>Misión social de hoy</h2>
    <p style="font-size:1.1rem;font-weight:500;margin:0 0 10px">${esc(mi.t)}</p>
    <p class="sci">${mi.tipo === 'desconocido' ? 'Antes de un reto así, la gente cree que un 40 % de los desconocidos querrá hablar; en la práctica lo quiso la gran mayoría, y la incomodidad bajó en una semana (Sandstrom, Boothby y Cooney, 2022).' : 'Una sola conversación de calidad al día con alguien cercano mejora el bienestar de ese día; mejor cara a cara (Hall et al., 2023).'}</p>
    ${hoyM ? `<p class="meta green">Hecha hoy.</p>` : `
    <div class="field"><label>Antes: del 1 al 7, ¿cuánto crees que la otra persona querrá hablar?</label><div class="chips" id="mi-pred">${[1, 2, 3, 4, 5, 6, 7].map(n => `<button class="chip" data-v="${n}">${n}</button>`).join('')}</div></div>
    <div class="field"><label>Después: ¿estaba abierta a hablar?</label><div class="chips" id="mi-res"><button class="chip" data-r="1">Sí</button><button class="chip" data-r="0">No mucho</button></div></div>`}
    ${xs.length ? `<p class="meta">Hasta ahora, ${abiertos} de ${xs.length} desconocidos estaban abiertos a hablar (${Math.round(abiertos / xs.length * 100)} %).</p>` : ''}

    <div class="set-row"><span>Presupuesto de distracción<small>Unos 30 min al día reducen el FOMO (Hunt et al., 2018)</small></span>
      <select id="s-bud">${[15, 30, 45, 60].map(n => `<option value="${n}" ${n === ES.presupuesto ? 'selected' : ''}>${n} min</option>`).join('')}</select></div>
    <div class="set-row"><span>Meta de iniciativas<small>Contactos, planes y pasos de proyecto por semana</small></span>
      <select id="s-meta">${Array.from({ length: 14 }, (_, i) => i + 1).map(n => `<option ${n === ES.metaSemanal ? 'selected' : ''}>${n}</option>`).join('')}</select></div>
    <h3>Ventanas de revisión</h3>
    <p class="meta">Revisar por lotes tres veces al día mejora la atención y baja el estrés (Fitz et al., 2019). Fuera de estas horas, la espera es el doble.</p>
    <div class="times" style="grid-template-columns:1fr 1fr 1fr">${[0, 1, 2].map(i => `<div class="field"><label>${['Primera', 'Segunda', 'Tercera'][i]}</label><input id="s-v${i + 1}" type="time" value="${ES.ventanas[i] || ''}"></div>`).join('')}</div>
    <div class="set-row"><span>Duración de cada ventana</span>
      <select id="s-vmin">${[10, 15, 20, 30].map(n => `<option value="${n}" ${n === ES.ventanaMin ? 'selected' : ''}>${n} min</option>`).join('')}</select></div>
    <h3>Apps que te distraen</h3>
    <div id="s-apps">${ES.apps.map(a => `<div class="app-row"><span class="t">${esc(a.nombre)}<small>${esc(a.url)}</small></span><button class="x" data-del="${esc(a.id)}" aria-label="Quitar">×</button></div>`).join('')}</div>
    <div class="add-app"><input id="s-an" placeholder="Nombre"><input id="s-au" placeholder="https://…" inputmode="url"><button class="link" id="s-add">Añadir</button></div>
    <p class="meta" style="margin-top:10px">En Android, la dirección web abre la app si la tienes instalada.</p>
    <h3>Alternativas</h3>
    <div class="field"><textarea id="s-alts">${esc(ES.alternativas.join('\n'))}</textarea><p class="meta" style="margin-top:6px">Una por línea.</p></div>
    <div class="set-row"><span>Configura tu teléfono<small>${CONFIG.filter(c => ES.config[c[0]]).length} de ${CONFIG.length} hechos</small></span><button class="link" id="s-conf">Ver</button></div>
    <div class="set-row"><span>Abrir la app en<small>En este teléfono</small></span>
      <select id="s-ini"><option value="enfoque">Enfoque</option><option value="hoy" ${localStorage.getItem('habit-inicio') === 'hoy' ? 'selected' : ''}>Hábitos</option></select></div>
    <div class="set-row"><span>Cómo usar Enfoque</span><button class="link" id="s-help">Ver</button></div>
    <div class="actions"><button class="primary" id="s-ok">Listo</button></div>`);
  const body = $('#sheet-body');
  body.querySelectorAll('[data-del]').forEach(b => b.onclick = () => { forget(b.dataset.del); ES.apps = ES.apps.filter(a => a.id !== b.dataset.del); guardar(); b.closest('.app-row').remove(); });
  $('#s-add').onclick = () => {
    const n = $('#s-an').value.trim(); let u = $('#s-au').value.trim();
    if (!n || !u) { (n ? $('#s-au') : $('#s-an')).focus(); return; }
    if (!/^[a-z][a-z0-9+.-]*:/i.test(u)) u = 'https://' + u;
    ES.apps.push({ id: crypto.randomUUID(), nombre: n, url: u }); guardar(); settings();
  };
  $('#s-help').onclick = welcome;
  $('#s-conf').onclick = configSheet;
  $('#s-ok').onclick = () => {
    try { localStorage.setItem('habit-inicio', $('#s-ini').value); } catch {}
    ES.limite = +$('#s-lim').value; ES.espera = +$('#s-wait').value;
    ES.presupuesto = +$('#s-bud').value; ES.metaSemanal = +$('#s-meta').value; ES.ventanaMin = +$('#s-vmin').value;
    const vs = [$('#s-v1').value, $('#s-v2').value, $('#s-v3').value].filter(Boolean); if (vs.length) ES.ventanas = vs;
    const alts = $('#s-alts').value.split('\n').map(s => s.trim()).filter(Boolean);
    if (alts.length) ES.alternativas = alts;
    guardar(); closeSheet(); renderE();
  };
}
$('#open-settings').onclick = settings;

// ---------- Bienvenida: el desincentivo de verdad es que las apps ya no estén a un toque.
function welcome() {
  showSheet(`<h2>Menos teléfono, más de lo que importa</h2>
    <p class="note">Enfoque es la pestaña que se pone entre tú y las apps que te roban tiempo. Tres pasos, una sola vez:</p>
    <ol class="pros" style="padding-left:20px">
      <li style="margin-bottom:8px"><b>Instala el Habit Tracker</b> en la pantalla de inicio (Chrome → ⋮ → «Instalar aplicación»). Se abre en esta pestaña.</li>
      <li style="margin-bottom:8px"><b>Quita Instagram, TikTok y demás de la pantalla de inicio</b>: mantén pulsado el icono → «Quitar» (no desinstalar). Siguen en el cajón de apps, pero ya no a un toque.</li>
      <li><b>Pon el Habit Tracker en su lugar.</b> Cuando el pulgar vaya solo a ese rincón, abrirás esta pregunta en vez del feed.</li>
    </ol>
    <p class="note">Después, añade a las personas con las que quieres mantener el contacto y tus proyectos en «Tomar la iniciativa»: cada día verás a quién escribir y el siguiente paso.</p>
    <p class="note">Para un tope estricto, combínalo con Bienestar digital de Android: Ajustes → Bienestar digital → Temporizadores de apps.</p>
    <div class="actions"><button class="link" id="w-conf">Configurar el teléfono</button><button class="primary" id="w-go">Empezar</button></div>`);
  $('#w-conf').onclick = () => { ES.bienvenida = true; guardar(); renderE(); configSheet(); };
  $('#w-go').onclick = () => {
    ES.bienvenida = true; guardar(); closeSheet(); renderE();
  };
}

// ---------- Arranque
window.renderEnfoque = () => renderE();
window.enfoqueArranque = () => {
  renderE();
  if (ES.sesion) { irA('enfoque'); if (focusLeft() <= 0) finishFocus(true); else { if (ES.sesion.fuera) { ES.sesion.ints++; ES.sesion.fuera = 0; guardar(); } showFocus(); } }
  else if (ES.salida) { irA('enfoque'); checkSalida(true); }
};
window.enfoqueVisible = () => { if (!ES.bienvenida) welcome(); };
let lastDay = today();
setInterval(() => { if (today() !== lastDay) { lastDay = today(); renderE(); } }, 60000);
})();

render();
// La app abre en Enfoque (la pregunta antes del feed), salvo que en este teléfono se elija Hábitos.
if (localStorage.getItem('habit-inicio') !== 'hoy') document.querySelector('.tabs .tab[data-view="enfoque"]').click();
window.enfoqueArranque();
setSync('local');
renderAccount();
connectCloud();
// Sin cuenta, la app lo recuerda al abrir (una vez al día) para que nada se quede solo en el teléfono.
if (!window.claude?.use && !auth && (state.habits.length || state.tareas.items.length) && localStorage.getItem('habit-nag') !== today()) {
  localStorage.setItem('habit-nag', today());
  setTimeout(() => accountForm('up'), 600);
}
</script>
</body>
</html>
