<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Habit Tracker</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="color-scheme" content="light dark">
<meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0e0e0e" media="(prefers-color-scheme: dark)">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon-192.png">
<style>
  :root {
    /* Tipografía: una sola variable. Pendiente: sustituir por la de Rial. */
    --font: system-ui, -apple-system, "Segoe UI", sans-serif;
    --bg: #ffffff; --text: #111111; --muted: #8a8a8a; --line: #ededed; --empty: #e6e6e6;
    --green: #1f9d55; --red: #d64545; --warn: #b7791f;
    --fire: #ff9600; --fire-dark: #d97800;
    /* Resortes reales (masa 1): bouncy k=180 c=10 · pop k=300 c=14 · soft k=120 c=14 */
    --spring-bouncy: linear(0, 0.067, 0.237, 0.462, 0.699, 0.916, 1.089, 1.208, 1.27, 1.282, 1.255, 1.202, 1.137, 1.07, 1.011, 0.966, 0.936, 0.922, 0.921, 0.931, 0.947, 0.966, 0.984, 1, 1.012, 1.02, 1.023, 1.022, 1.019, 1.014, 1.008, 1.003, 0.999, 0.996, 0.994, 0.994, 0.994, 0.995, 0.996, 0.998, 0.999, 1.001, 1.001, 1.002, 1.002, 1.002, 1.001, 1.001, 1);
    --spring-pop: linear(0, 0.057, 0.203, 0.399, 0.612, 0.813, 0.985, 1.115, 1.201, 1.243, 1.248, 1.224, 1.183, 1.131, 1.078, 1.03, 0.991, 0.962, 0.945, 0.938, 0.94, 0.947, 0.959, 0.972, 0.985, 0.996, 1.005, 1.011, 1.015, 1.016, 1.015, 1.012, 1.009, 1.006, 1.003, 1, 0.998, 0.997, 0.996, 0.996, 0.997, 0.997, 0.998, 0.999, 1, 1, 1.001, 1.001, 1);
    --spring-soft: linear(0, 0.023, 0.083, 0.168, 0.269, 0.376, 0.484, 0.588, 0.684, 0.769, 0.844, 0.906, 0.957, 0.998, 1.028, 1.049, 1.063, 1.071, 1.074, 1.072, 1.068, 1.062, 1.055, 1.047, 1.039, 1.031, 1.024, 1.018, 1.012, 1.007, 1.004, 1.001, 0.998, 0.997, 0.995, 0.995, 0.995, 0.995, 0.995, 0.995, 0.996, 0.996, 0.997, 0.998, 0.998, 0.999, 0.999, 0.999, 1);
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #0e0e0e; --text: #f2f2f2; --muted: #7a7a7a; --line: #1f1f1f; --empty: #2a2a2a;
      --green: #3fbf75; --red: #ef6a6a; --warn: #d9a441; color-scheme: dark;
    }
  }
  :root[data-theme="dark"] {
    --bg: #0e0e0e; --text: #f2f2f2; --muted: #7a7a7a; --line: #1f1f1f; --empty: #2a2a2a;
    --green: #3fbf75; --red: #ef6a6a; --warn: #d9a441; color-scheme: dark;
  }
  * { box-sizing: border-box; }
  [hidden] { display: none !important; }
  html { background: var(--bg); color-scheme: light dark; min-height: 100%; overscroll-behavior-y: none; }
  body { margin: 0; min-height: 100dvh; background: var(--bg); color: var(--text); font: 16px/1.5 var(--font);
    -webkit-font-smoothing: antialiased; }
  main { max-width: 520px; margin: 0 auto; padding-block: 48px calc(84px + env(safe-area-inset-bottom, 0px));
    padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
  .top { display: flex; justify-content: space-between; align-items: flex-start; gap: 16px; }
  .global { text-align: right; }
  .g-streak { display: inline-flex; align-items: center; gap: 4px; font-size: 1.6rem; font-weight: 600;
    font-variant-numeric: tabular-nums; letter-spacing: -.02em; }
  .g-streak svg { width: 26px; height: 26px; }
  .g-rate { color: var(--muted); font-size: .8rem; }
  .flame.off { filter: grayscale(1); opacity: .35; }
  h1 { font-size: 2rem; font-weight: 600; letter-spacing: -.02em; margin: 0; }
  h1.tap { cursor: pointer; }
  .date { color: var(--muted); margin: 2px 0 32px; }
  button { font: inherit; color: inherit; background: none; border: 0; padding: 0; cursor: pointer; }
  .link { color: var(--muted); font-size: .9rem; }
  .link:hover { color: var(--text); }
  .note { color: var(--muted); font-size: .9rem; margin: 0 0 24px; }

  .habit { border-top: 1px solid var(--line); padding: 18px 0; }
  #list > .habit:last-child { border-bottom: 1px solid var(--line); }
  .children { margin: 10px 0 0 54px; }
  .children .habit { padding: 12px 0; }
  .children .actions { margin-top: 6px; }
  .row { display: flex; align-items: center; gap: 14px; }
  .habit, #form { --c: var(--text); }
  .check { flex: none; width: 40px; height: 40px; border-radius: 50%; border: 1.5px solid var(--c);
    color: var(--c); display: grid; place-items: center; transition: background .15s, color .15s; }
  .check.done { background: var(--c); color: var(--bg); }
  .check.half { background: linear-gradient(90deg, color-mix(in srgb, var(--c) 25%, transparent) 50%, transparent 50%); }
  .check.skip { border-color: var(--empty); color: var(--muted); }
  .check svg, .icon-pick svg { width: 20px; height: 20px; }
  .title { flex: 1; min-width: 0; text-align: left; }
  .name { font-weight: 500; }
  .identity { color: var(--muted); font-size: .85rem; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .streak { color: var(--muted); font-variant-numeric: tabular-nums; font-size: .9rem;
    display: inline-flex; align-items: center; gap: 3px; }
  .streak svg { width: 16px; height: 16px; }
  .streak.on { color: var(--text); font-weight: 600; }
  .check { position: relative; }
  .spark { position: absolute; left: 50%; top: 50%; width: 6px; height: 6px; margin: -3px; border-radius: 50%;
    background: var(--c); pointer-events: none; }
  .warn { color: var(--warn); font-size: .85rem; margin: 8px 0 0 54px; }

  .detail { margin: 16px 0 0 54px; }
  .chain { display: flex; gap: 5px; margin-bottom: 14px; }
  .chain span { width: 8px; height: 8px; border-radius: 50%; background: var(--empty); }
  .chain .full { background: var(--c); }
  .chain .min { background: color-mix(in srgb, var(--c) 45%, transparent); }
  .intent, .meta { font-size: .9rem; color: var(--muted); margin: 0 0 4px; }
  .intent b { color: var(--text); font-weight: 500; }
  h3 { font-size: .8rem; font-weight: 600; text-transform: uppercase; letter-spacing: .06em; margin: 18px 0 6px; }
  h3.benefits { color: var(--green); }
  h3.cons { color: var(--red); }
  ul { margin: 0; padding-left: 18px; font-size: .95rem; }
  li { margin: 2px 0; }
  .actions { display: flex; flex-wrap: wrap; gap: 8px 18px; margin-top: 18px; white-space: nowrap; }

  .empty { color: var(--muted); padding: 24px 0; }
  .adds { display: flex; gap: 24px; margin-top: 28px; }
  .add { font-weight: 500; }
  .outline { display: block; margin-top: 24px; padding: 11px 18px; border-radius: 999px; border: 1.5px solid var(--text);
    font-weight: 500; }
  .outline:active { background: var(--text); color: var(--bg); }
  #account { margin-top: 72px; }
  #account .outline { margin-top: 0; }
  .backup { display: flex; gap: 20px; margin-top: 28px; padding-top: 22px; border-top: 1px solid var(--line); }
  .ver { color: var(--muted); font-size: .8rem; margin-top: 16px; display: flex; gap: 16px; align-items: center; }
  .acct { display: flex; flex-wrap: wrap; align-items: center; gap: 6px 16px; margin-top: 24px; font-size: .9rem; color: var(--muted); }
  .acct b { color: var(--text); font-weight: 500; word-break: break-all; }
  .field { margin-top: 14px; }
  .upd { display: flex; justify-content: space-between; align-items: center; gap: 12px; padding: 10px 14px; margin: 0 0 20px;
    border: 1.5px solid var(--text); border-radius: 12px; font-size: .9rem; }
  .upd .primary { padding: 7px 14px; }
  /* Modo, días y horas en el formulario */
  .seg { display: flex; border: 1.5px solid var(--line); border-radius: 999px; overflow: hidden; margin-top: 6px; }
  .seg label { flex: 1; margin: 0; text-align: center; padding: 8px 4px; font-size: .88rem; color: var(--muted); cursor: pointer; }
  .seg input { position: absolute; opacity: 0; pointer-events: none; }
  .seg label:has(input:checked) { background: var(--text); color: var(--bg); }
  .days { display: flex; gap: 6px; margin-top: 6px; }
  .days label { flex: 1; margin: 0; text-align: center; padding: 8px 0; border-radius: 10px; border: 1.5px solid var(--line);
    font-size: .85rem; color: var(--muted); cursor: pointer; }
  .days input { position: absolute; opacity: 0; pointer-events: none; }
  .days label:has(input:checked) { border-color: var(--c); color: var(--c); font-weight: 600; }
  .hours { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 8px; }
  .hour-chip { display: inline-flex; align-items: center; gap: 6px; padding: 5px 6px 5px 12px; border-radius: 999px;
    border: 1.5px solid var(--line); font-size: .88rem; }
  .hour-chip button { color: var(--muted); font-size: 1rem; line-height: 1; padding: 0 4px; }
  .add-hour { margin-left: 10px; color: var(--muted); font-size: .88rem; white-space: nowrap; }
  /* Progreso en el círculo (veces / cronómetro) */
  .check .pv { font-size: .72rem; font-weight: 700; font-variant-numeric: tabular-nums; letter-spacing: -.02em; }
  .check.prog::after { content: ""; position: absolute; inset: -1.5px; border-radius: 50%;
    background: conic-gradient(var(--c) var(--p, 0%), transparent 0);
    -webkit-mask: radial-gradient(farthest-side, transparent calc(100% - 3px), #000 calc(100% - 2.5px)); mask: radial-gradient(farthest-side, transparent calc(100% - 3px), #000 calc(100% - 2.5px)); }
  .check.run { border-style: dashed; }
  .habit.off { opacity: .45; }
  .habit.off .check { border-style: dotted; }
  .group-title { color: var(--muted); font-size: .8rem; text-transform: uppercase; letter-spacing: .06em; margin: 26px 0 4px; }
  /* Tareas, al estilo Google Tasks */
  .tlists { display: flex; gap: 8px; overflow-x: auto; margin-bottom: 20px; scrollbar-width: none; padding-bottom: 2px; }
  .tadd { display: flex; align-items: center; gap: 12px; padding: 10px 0 18px; }
  .tadd .plus { width: 28px; height: 28px; border-radius: 50%; border: 1.5px solid var(--muted); color: var(--muted); display: grid; place-items: center; flex: none; font-size: 1.2rem; line-height: 1; }
  .tadd input { border: 0; padding: 6px 0; }
  .task { display: flex; align-items: flex-start; gap: 14px; padding: 12px 0; border-top: 1px solid var(--line); }
  .task:last-child { border-bottom: 1px solid var(--line); }
  .task .tcheck { flex: none; width: 24px; height: 24px; margin-top: 1px; border-radius: 50%; border: 1.5px solid var(--text); display: grid; place-items: center; color: var(--bg); }
  .task .tcheck svg { width: 13px; height: 13px; opacity: 0; }
  .task.done .tcheck { background: var(--text); } .task.done .tcheck svg { opacity: 1; }
  .task .tbody { flex: 1; min-width: 0; text-align: left; }
  .task .ttitle { font-weight: 500; }
  .task.done .ttitle { text-decoration: line-through; color: var(--muted); font-weight: 400; }
  .task .tdetail { color: var(--muted); font-size: .88rem; white-space: pre-wrap; }
  .task .tdate { display: inline-block; margin-top: 4px; font-size: .78rem; color: var(--muted); border: 1px solid var(--line); border-radius: 999px; padding: 2px 8px; }
  .task .tdate.late { color: var(--red); border-color: var(--red); }
  .tdone-toggle { margin-top: 22px; }
  .tclean { display: flex; align-items: center; gap: 10px; padding: 22px 0; color: var(--muted); }
  .tclean svg { width: 26px; height: 26px; color: var(--green); }
  @media (prefers-reduced-motion: no-preference) {
    .task .tcheck { transition: background .15s; position: relative; }
    .task .ttitle { position: relative; display: inline; }
    .task .ttitle::after { content: ''; position: absolute; left: 0; top: 56%; height: 1.5px; width: 0; background: var(--muted); }
    .task.done .ttitle { text-decoration: none; } .task.done .ttitle::after { width: 100%; }
    .task .tcheck svg path { stroke-dasharray: 20; }
    .task.just-done .tcheck { animation: pop-spring .9s var(--spring-pop); }
    .task.completing .tcheck { background: var(--text); animation: pop-spring .9s var(--spring-pop); }
    .task.completing .tcheck svg { opacity: 1; } .task.completing .tcheck svg path { stroke-dashoffset: 20; animation: draw .35s ease-out .12s forwards; }
    .task.completing .tcheck::after { content: ''; position: absolute; inset: -2px; border-radius: 50%; border: 1.5px solid var(--text); animation: ring .6s ease-out .05s forwards; }
    .task.completing .ttitle { animation: to-muted .4s ease .25s forwards; }
    .task.completing .ttitle::after { animation: strike .55s var(--spring-soft) .18s forwards; }
    .task.leaving { transition: height .45s var(--spring-soft), padding .45s var(--spring-soft), opacity .3s ease, transform .45s var(--spring-soft); height: 0 !important; padding-block: 0 !important; opacity: 0; transform: translateX(-16px); overflow: hidden; border-top-width: 0; }
    .task.new-task { animation: slide-in .8s var(--spring-pop); }
    .task.just-undone { animation: slide-in .8s var(--spring-pop); }
    .tclean { animation: slide-in .9s var(--spring-pop); }
    .tclean svg { animation: pop-spring .9s var(--spring-pop) .1s both; }
    @keyframes draw { to { stroke-dashoffset: 0; } }
    @keyframes strike { to { width: 100%; } }
    @keyframes to-muted { to { color: var(--muted); font-weight: 400; } }
    @keyframes slide-in { from { opacity: 0; transform: translateY(-10px) scale(.97); } }
    .check .pv { transition: transform .2s; }
  }

  dialog { border: 0; padding: 28px 24px; width: min(480px, calc(100vw - 32px));
    background: var(--bg); color: var(--text); border-radius: 14px; }
  dialog::backdrop { background: rgba(0,0,0,.35); }
  dialog h2 { font-size: 1.3rem; font-weight: 600; margin: 0 0 8px; letter-spacing: -.01em; }
  label { display: block; margin: 18px 0 2px; font-size: .8rem; color: var(--muted); }
  label.benefits { color: var(--green); } label.cons { color: var(--red); }
  fieldset { border: 0; padding: 0; margin: 0; min-width: 0; }
  input, textarea, select { width: 100%; font: inherit; padding: 6px 0; border: 0; border-bottom: 1px solid var(--line);
    background: none; color: var(--text); border-radius: 0; outline: none; }
  input:focus, textarea:focus, select:focus { border-color: var(--text); }
  textarea { min-height: 56px; resize: vertical; }
  .two { display: flex; gap: 16px; } .two > div { flex: 1; min-width: 0; }
  .time { display: flex; align-items: center; gap: 4px; }
  .time select { width: 64px; flex: none; }
  select { background: var(--bg); }
  option { background: var(--bg); color: var(--text); }
  option:checked { background: var(--text); color: var(--bg); }
  .ampm { display: flex; border: 1.5px solid var(--line); border-radius: 999px; overflow: hidden; flex: none; margin-left: 12px; }
  .ampm label { margin: 0; padding: 5px 14px; font-size: .78rem; color: var(--muted); cursor: pointer; }
  .ampm input { position: absolute; opacity: 0; pointer-events: none; }
  .ampm label:has(input:checked) { background: var(--text); color: var(--bg); }
  .ampm label:has(input:focus-visible) { outline: 2px solid var(--muted); outline-offset: -2px; }
  .dialog-actions { display: flex; justify-content: flex-end; align-items: center; gap: 24px; margin-top: 28px; }
  .dialog-actions .danger { color: var(--red); margin-right: auto; }
  .primary { background: var(--text); color: var(--bg); padding: 10px 18px; border-radius: 999px; font-weight: 500; }
  .picker { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 8px; }
  .picker label { display: block; margin: 0; }
  .picker input { position: absolute; opacity: 0; pointer-events: none; }
  .icon-pick { width: 40px; height: 40px; border-radius: 50%; display: grid; place-items: center;
    color: var(--muted); border: 1.5px solid transparent; cursor: pointer; }
  input:checked + .icon-pick { color: var(--c); border-color: var(--c); }
  .swatch { display: block; width: 28px; height: 28px; border-radius: 50%; background: var(--sw); cursor: pointer;
    border: 2px solid transparent; }
  input:checked + .swatch { border: 2px solid var(--sw); box-shadow: inset 0 0 0 3px var(--bg); }
  input:focus-visible + .icon-pick, input:focus-visible + .swatch { outline: 2px solid var(--muted); outline-offset: 2px; }
  /* Celebración a pantalla completa, como la racha de Duolingo */
  .cele { position: fixed; inset: 0; z-index: 20; background: var(--bg); display: flex; justify-content: center;
    align-items: center; overflow-y: auto; text-align: center;
    padding-block: calc(24px + env(safe-area-inset-top, 0px)) calc(24px + env(safe-area-inset-bottom, 0px));
    padding-left: max(24px, env(safe-area-inset-left, 0px)); padding-right: max(24px, env(safe-area-inset-right, 0px)); }
  .cele-inner { width: 100%; max-width: 360px; display: flex; flex-direction: column; align-items: center; margin: auto; }
  .cele-canvas { position: absolute; inset: 0; width: 100%; height: 100%; pointer-events: none; }
  .cele-flame { position: relative; width: 128px; height: 128px; transform-origin: 50% 88%; }
  .cele-flame > svg { position: relative; width: 100%; height: 100%; transform-origin: 50% 88%;
    filter: grayscale(1) opacity(.3); transition: filter .25s ease; }
  .cele.lit .cele-flame > svg { filter: none; }
  /* Sunburst: rayos del mismo naranja, muy tenues, que giran detrás del fuego */
  .sunburst { position: absolute; inset: -90%; border-radius: 50%; opacity: 0; pointer-events: none;
    background: repeating-conic-gradient(from 0deg, color-mix(in srgb, var(--fire) 14%, transparent) 0 6deg, transparent 6deg 20deg);
    mask: radial-gradient(circle, #000 20%, transparent 68%); -webkit-mask: radial-gradient(circle, #000 20%, transparent 68%); }
  .cele-glow { position: absolute; inset: 8%; border-radius: 50%; opacity: 0;
    background: radial-gradient(circle, color-mix(in srgb, var(--fire) 45%, transparent), transparent 70%); }
  .roll { height: 1em; overflow: hidden; font-size: 5.5rem; font-weight: 800; line-height: 1; color: var(--fire);
    letter-spacing: -.04em; font-variant-numeric: tabular-nums; margin-top: 6px; }
  .roll-inner { display: flex; flex-direction: column; }
  .roll-inner span { height: 1em; }
  .roll.go .roll-inner { transform: translateY(-1em); }
  .roll-inner span:last-child { transform-origin: 50% 60%; }
  .wk i { position: relative; }
  .wk i::after { content: ""; position: absolute; inset: -3px; border-radius: 50%; border: 2px solid var(--fire); opacity: 0; }
  .cele-label { font-size: 1.15rem; font-weight: 700; color: var(--fire); margin: 6px 0 26px; }
  .week { display: flex; gap: 10px; justify-content: center; margin-bottom: 26px; }
  .wk { display: flex; flex-direction: column; align-items: center; gap: 6px; font-size: .75rem; color: var(--muted); }
  .wk i { width: 32px; height: 32px; border-radius: 50%; background: var(--empty); display: grid; place-items: center; color: #fff; }
  .wk i svg { width: 15px; height: 15px; }
  .wk.done i, .wk.today.fill i { background: var(--fire); }
  .wk.today { color: var(--text); font-weight: 700; }
  .wk.today:not(.fill) i svg { opacity: 0; }
  .motivation { font-size: 1.15rem; font-weight: 600; margin: 0 0 4px; text-wrap: balance; }
  .cele-benefits { align-self: stretch; text-align: left; margin-top: 10px; }
  .cele-go { margin-top: 28px; width: 100%; padding: 15px; border-radius: 16px; background: var(--fire); color: #fff;
    font-weight: 700; letter-spacing: .08em; text-transform: uppercase; box-shadow: 0 4px 0 var(--fire-dark); }
  .cele-go:active { transform: translateY(4px); box-shadow: none; }
  .cele-go:focus-visible { outline: 2px solid var(--text); outline-offset: 3px; }
  .big { font-size: 1.6rem; font-weight: 600; letter-spacing: -.02em; margin: 0 0 4px; }
  @media (prefers-reduced-motion: no-preference) {
    dialog[open] { animation: rise .38s cubic-bezier(.2, .9, .3, 1.25); }
    dialog[open]::backdrop { animation: fade .25s ease; }
    .detail, .children { animation: slide .28s ease both; }
    .check:active { transform: scale(.9); }
    .check { transition: background .2s, color .2s, transform .15s; }
    .pop .check { animation: pop-spring .9s var(--spring-pop); }
    .pop .check::before { content: ""; position: absolute; inset: -2px; border-radius: 50%; border: 2px solid var(--c);
      animation: ring .7s ease-out forwards; pointer-events: none; }
    .pop .streak { animation: bump-spring .9s var(--spring-pop) .1s; }
    .spark { animation: spark .6s cubic-bezier(.1, .8, .3, 1) forwards; }
    .g-streak .flame:not(.off) { animation: flicker 2.4s ease-in-out infinite; transform-origin: 50% 90%; }
    .g-streak.bump { animation: bump-spring .9s var(--spring-pop); }
    .cele { animation: fade .2s ease; }
    .cele.out { animation: fade .2s ease reverse forwards; }
    /* 1. Anticipación: el fuego gris entra pequeño y se posa */
    .cele-flame { animation: settle .5s var(--spring-soft) .05s both; }
    /* 2. Squash & stretch + resorte al encenderse; luego flicker */
    .cele.lit .cele-flame { animation: squash-stretch .2s ease-in forwards, ignite-spring 1.4s var(--spring-bouncy) .2s both; }
    .cele.lit .cele-flame > svg { animation: flicker 1.6s ease-in-out 1.4s infinite; }
    .cele.lit .sunburst { animation: sunburst 1.3s ease-out .2s both; }

    @keyframes sunburst { 0% { transform: rotate(0) scale(.4); opacity: 0; } 25% { opacity: 1; } 100% { transform: rotate(40deg) scale(1.15); opacity: 0; } }

    @keyframes pop-spring { from { transform: scale(.6); } to { transform: scale(1); } }
    @keyframes bump-spring { from { transform: scale(1.45); } to { transform: scale(1); } }
    @keyframes rise-spring { from { transform: translateY(18px); opacity: 0; } to { transform: none; opacity: 1; } }

<script>
const KEY = 'habit-tracker-v1';
const APP_VERSION = '2.7.0';
const ALL_DAYS = [0, 1, 2, 3, 4, 5, 6], DAY_L = ['L', 'M', 'X', 'J', 'V', 'S', 'D'];
const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
// Símbolos de línea fina, todos en una rejilla de 24×24.
const ICONS = {
  punto: '<circle cx="12" cy="12" r="3"/>',
  libro: '<path d="M4 19.5V5a2 2 0 0 1 2-2h14v15H6a2 2 0 0 0-2 2 2 2 0 0 0 2 2h14v-4"/>',
  agua: '<path d="M12 3s6 6.5 6 11a6 6 0 0 1-12 0c0-4.5 6-11 6-11z"/>',
  luna: '<path d="M20 14.5A8 8 0 1 1 9.5 4a6.5 6.5 0 0 0 10.5 10.5z"/>',
  sol: '<circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/>',
  pesa: '<path d="M6.5 7v10M17.5 7v10M3.5 9.5v5M20.5 9.5v5M6.5 12h11"/>',
  corazon: '<path d="M12 20s-7.5-4.6-7.5-10.2A4.3 4.3 0 0 1 12 7.3a4.3 4.3 0 0 1 7.5 2.5C19.5 15.4 12 20 12 20z"/>',
  hoja: '<path d="M5 19C5 10.5 10.5 5 19 5c0 8.5-5.5 14-14 14z"/><path d="M5 19l7.5-7.5"/>',
  lapiz: '<path d="M4 20l1-4L16.5 4.5l3 3L8 19z"/><path d="M14 7l3 3"/>',
  rayo: '<path d="M13 2L4.5 13.5H11L10 22l8.5-11.5H12z"/>',
  musica: '<path d="M9 18V5l11-2v13"/><circle cx="6.5" cy="18" r="2.5"/><circle cx="17.5" cy="16" r="2.5"/>',
  reloj: '<circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/>',
  movil: '<rect x="7" y="2.5" width="10" height="19" rx="2.5"/><path d="M3 3l18 18"/>',
  moneda: '<circle cx="12" cy="12" r="9"/><path d="M14.5 9h-3.2a1.8 1.8 0 0 0 0 3.6h1.4a1.8 1.8 0 0 1 0 3.6H9.5M12 7v2M12 16.2v1.8"/>',
  personas: '<circle cx="9" cy="8" r="3"/><path d="M3.5 20a5.5 5.5 0 0 1 11 0"/><path d="M16 5.2a3 3 0 0 1 0 5.6M18 14.5a5.5 5.5 0 0 1 2.5 5.5"/>',
  sonrisa: '<circle cx="12" cy="12" r="9"/><path d="M8.5 14.5a4 4 0 0 0 7 0"/><path d="M9 9.5h.01M15 9.5h.01"/>',
  estrella: '<path d="M12 3l2.8 5.8 6.2.9-4.5 4.4 1.1 6.2L12 17.3l-5.6 3 1.1-6.2L3 9.7l6.2-.9z"/>',
};
const icon = name => `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">${ICONS[name] || ICONS.punto}</svg>`;
// '' = el color del texto (negro / blanco según el tema).
const COLORS = ['', '#3b82f6', '#8b5cf6', '#ec4899', '#f97316', '#eab308', '#14b8a6', '#64748b'];
const colorVar = h => h.color ? `--c:${h.color}` : '';
let flameId = 0;
const flame = (off = false) => {
  const id = 'fl' + flameId++;
  return `<svg class="flame${off ? ' off' : ''}" viewBox="0 0 24 24" aria-hidden="true">
    <defs><linearGradient id="${id}" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ffb400"/><stop offset="1" stop-color="#ff4b00"/></linearGradient></defs>
    <path fill="url(#${id})" d="M12 1.8c.9 3.4 5.8 5.9 5.8 11.6a5.8 5.8 0 0 1-11.6 0c0-2.8 1.4-4.7 2.8-5.9.1 2.1 1 3.4 2.2 3.8-.6-3.6.1-6.8.8-9.5z"/>
    <path fill="#ffd84a" d="M12 13c.7 1.5 2.5 2.4 2.5 4.4a2.5 2.5 0 0 1-5 0c0-1.3.8-2.2 1.6-2.8.1.6.4 1 .9 1.1-.3-.9-.2-1.9 0-2.7z"/>
  </svg>`;
};
// Mensaje según la racha: cada día es un voto por quien quieres ser.
function motivation(n) {
  if (n >= 66) return 'Hábito consolidado. Esto ya es quien eres.';
  if (n >= 30) return 'Un mes de votos seguidos. Imparable.';
  if (n >= 14) return 'Dos semanas. Ya no lo piensas, lo haces.';
  if (n >= 7) return '¡Una semana entera! La cadena es tuya.';
  if (n >= 3) return '¡Vas encendido! No rompas la cadena.';
  if (n === 2) return 'Dos días. Ya es una cadena.';
  return 'Primer voto. Así empieza todo.';
}
function globalStats() {
  const hs = state.habits.filter(h => !h.rutina);
  // Racha general: días seguidos en los que hiciste al menos un hábito.
  const any = day => hs.some(h => isDone(h, day));
  const excused = day => hs.some(h => isJust(h, day));
  const anySched = day => hs.some(h => h.creado <= day && isSched(h, day));
  let streak = 0, d = new Date();
  if (!any(dayKey(d))) d = addDays(d, -1);
  for (let i = 0; i < 3660 && hs.length; i++) {
    const k = dayKey(d);
    if (any(k)) streak++;
    else if (!(excused(k) || !anySched(k))) break;
    if (!hs.some(h => h.creado <= k)) break;
    d = addDays(d, -1);
  }
  // Acierto de los últimos 7 días; lo de hoy solo cuenta cuando ya lo marcaste.
  let possible = 0, ok = 0;
  for (let i = 0; i < 7; i++) {
    const day = dayKey(addDays(new Date(), -i));
    for (const h of hs) {
      if (h.creado > day || !isSched(h, day) || (i === 0 && !mark(h, day)) || isJust(h, day)) continue;
      possible++;
      if (isDone(h, day)) ok++;
    }
  }
  return { streak, rate: possible ? Math.round(ok / possible * 100) : null };
}
let justDone = null;

let state = load();
const open = new Set();
function load() {
  let s;
  try { s = JSON.parse(localStorage.getItem(KEY)); } catch {}
  return normalize(s);
}

const today = () => dayKey(new Date());
const daysBetween = (a, b) => Math.round((new Date(b + 'T12:00') - new Date(a + 'T12:00')) / 864e5);

const mark = (h, day) => state.log[h.id]?.[day];
const isDone = (h, day) => ['full', 'min'].includes(mark(h, day));
// Un día justificado no cuenta ni a favor ni en contra: no rompe la racha.
const isJust = (h, day) => mark(h, day) === 'just';
const JUST_PER_MONTH = 2;
const justUsed = (h, month) => Object.keys(state.log[h.id] || {}).filter(d => d.startsWith(month) && isJust(h, d)).length;

function stats(h) {
  const t = today();
  const age = daysBetween(h.creado, t);
  const days = Object.keys(state.log[h.id] || {});
  const done = days.filter(d => isDone(h, d)).length;
  // Días pasados (sin contar hoy) que tocaban y no se hicieron ni se justificaron.
  let missed = 0;
  for (let d = new Date(h.creado + 'T12:00'); dayKey(d) < t; d = addDays(d, 1)) {
    const k = dayKey(d);
    if (isSched(h, k) && !isDone(h, k) && !isJust(h, k)) missed++;
  }
  // Racha: cuenta hacia atrás desde hoy; si hoy aún no está, desde ayer. Los días que no tocan no la rompen.
  let streak = 0, d = new Date();
  if (!isDone(h, dayKey(d))) d = addDays(d, -1);
  while (dayKey(d) >= h.creado) {
    const k = dayKey(d);
    if (isDone(h, k)) streak++;
    else if (!(isJust(h, k) || !isSched(h, k))) break;
    d = addDays(d, -1);
  }
  // Ayer: el último día que tocaba antes de hoy.
  let yd = addDays(new Date(), -1);
  while (dayKey(yd) >= h.creado && !isSched(h, dayKey(yd))) yd = addDays(yd, -1);
  const yesterday = dayKey(yd);
  const missedYesterday = h.creado <= yesterday && isSched(h, yesterday) && !isDone(h, yesterday) && !isJust(h, yesterday);
  return { age, done, streak, missedYesterday };
}

const list = items => `<ul>${items.map(i => `<li>${esc(i)}</li>`).join('')}</ul>`;
const benefitsHTML = h => `<h3 class="benefits">Beneficios</h3>${list(h.beneficios)}`;
const consHTML = h => `<h3 class="cons">Contras de no hacerlo</h3>${list(h.contras)}`;

function render() {
  const fecha = new Date().toLocaleDateString('es', { weekday: 'long', day: 'numeric', month: 'long' });
  $('#today').textContent = fecha[0].toUpperCase() + fecha.slice(1);
  renderTitle();
  const g = globalStats();
  const prevStreak = $('#global').dataset.streak;
  $('#global').dataset.streak = g.streak;
  $('#global').innerHTML = `<div class="g-streak${prevStreak !== undefined && +prevStreak !== g.streak ? ' bump' : ''}" title="Racha general">${flame(!g.streak)}${g.streak}</div>
    <div class="g-rate">${g.rate === null ? 'Sin datos aún' : g.rate + '% esta semana'}</div>`;
  const top = state.habits.filter(h => !h.padre).sort((a, b) => (b.clave ? 1 : 0) - (a.clave ? 1 : 0));

  const building = state.habits.filter(h => !h.rutina && stats(h).done < 66).length;
  $('#notice').hidden = building <= 3;
  $('#notice').textContent = `${building} hábitos en construcción. Menos, pero mejor: consolida uno antes de añadir otro.`;

  if (!top.length) {
    $('#list').innerHTML = `<p class="empty">Empieza por un solo hábito, tan pequeño que no puedas decir que no.</p>`;
    return;
  }
  const t = today();
  const hoy = top.filter(h => h.rutina || isSched(h, t)), otros = top.filter(h => !h.rutina && !isSched(h, t));
  $('#list').innerHTML = (hoy.length ? hoy.map(h => h.rutina ? routineHTML(h) : habitHTML(h)).join('') : `<p class="empty">Hoy no toca ningún hábito.</p>`)
    + (otros.length ? `<p class="group-title">Otros días</p>` + otros.map(h => habitHTML(h)).join('') : '');
  tickTimers();
}

// Una rutina agrupa hábitos: se abre con un toque y muestra los suyos dentro.
function routineHTML(r) {
  const kids = state.habits.filter(h => h.padre === r.id && isSched(h, today()));
  const done = kids.filter(h => isDone(h, today())).length;
  const checkClass = kids.length && done === kids.length ? 'done' : done ? 'half' : '';
  const inside = open.has(r.id) ? `<div class="children">
      ${kids.map(habitHTML).join('')}
      <div class="actions">
        <button class="link" data-act="add-in" data-id="${r.id}">+ Añadir hábito</button>
        <button class="link" data-act="edit" data-id="${r.id}">Editar rutina</button>
      </div>
    </div>` : '';
  return `<section class="habit" style="${colorVar(r)}">
    <div class="row">
      <button class="check ${checkClass}" data-act="toggle" data-id="${r.id}" aria-label="Abrir rutina">${icon(r.icono)}</button>
      <button class="title" data-act="toggle" data-id="${r.id}">
        <div class="name">${esc(r.nombre)}</div>
        <div class="identity">${kids.length === 1 ? '1 hábito' : kids.length + ' hábitos'}</div>
      </button>
      <span class="streak">${done}/${kids.length}</span>
    </div>
    ${inside}
  </section>`;
}

function habitHTML(h) {
  const s = stats(h), t = today(), m = mark(h, t), sched = isSched(h, t);
  let checkClass = m === 'full' ? 'done' : m === 'min' ? 'half' : m ? 'skip' : '';
  const warn = sched && s.missedYesterday && !m;
  // Qué hace el círculo según el modo.
  let act = m ? 'undo' : 'full', inner = icon(h.icono), style = '';
  if (!m && sched && h.modo === 'veces') {
    const p = progressOf(h, t);
    act = 'plus'; checkClass += ' prog'; style = `--p:${Math.min(100, p / h.meta * 100)}%`;
    if (p) inner = `<span class="pv">${p}/${h.meta}</span>`;
  } else if (!m && sched && h.modo === 'tiempo') {
    const e = elapsedOf(h), run = !!state.timers[h.id]?.start;
    act = 'timer'; checkClass += ' prog' + (run ? ' run' : ''); style = `--p:${Math.min(100, e / (h.meta * 60) * 100)}%`;
    if (e > 0 || run) inner = `<span class="pv">${fmtSec(Math.max(0, h.meta * 60 - e))}</span>`;
  }
  if (!sched) act = 'toggle';

  let detail = '';
  if (open.has(h.id)) {
    const chain = Array.from({ length: 14 }, (_, i) => {
      const v = mark(h, dayKey(addDays(new Date(), i - 13)));
      return `<span class="${v === 'full' || v === 'min' ? v : ''}"></span>`;
    }).join('');
    const intent = [
      h.despuesDe && `Después de <b>${esc(h.despuesDe)}</b>,`,
      `haré <b>${esc(h.nombre)}</b>`,
      h.horas.length && `a las <b>${h.horas.map(fmtHora).map(esc).join(' y ')}</b>`,
      h.lugar && `en <b>${esc(h.lugar)}</b>`,
      h.dias.length < 7 && `(${h.dias.map(d => DAY_L[d]).join(' ')})`,
    ].filter(Boolean).join(' ').replace(/^h/, 'H') + '.';
    const modeLine = h.modo === 'veces' ? `${h.meta} ${h.meta === 1 ? 'vez' : 'veces'} al día` : h.modo === 'tiempo' ? `${h.meta} min al día` : '';

    let tip = '';
    if (s.done >= 66) tip = 'Consolidado. Ya forma parte de quien eres.';
    else if (s.streak >= 14) tip = '14 días seguidos. ¿Subes un poco la dificultad?';
    else if (s.age >= 10 && s.age <= 40) tip = 'Los resultados llegan tarde. Cada día es un voto.';

    const actions = !sched ? '' : m
      ? `<button class="link" data-act="undo" data-id="${h.id}">Deshacer</button>`
      : `${h.modo === 'veces' && progressOf(h, t) ? `<button class="link" data-act="minus" data-id="${h.id}">−1</button>` : ''}
         ${h.modo === 'tiempo' && elapsedOf(h) > 0 ? `<button class="link" data-act="treset" data-id="${h.id}">Reiniciar</button>` : ''}
         <button class="link" data-act="min" data-id="${h.id}">Versión 2 min</button>
         <button class="link" data-act="skip" data-id="${h.id}">Hoy no</button>`;

    detail = `<div class="detail">
      <div class="chain" aria-label="Últimos 14 días">${chain}</div>
      <p class="intent">${intent}</p>
      <p class="meta">${modeLine ? modeLine + ' · ' : ''}${s.done} votos · ${esc(h.identidad)}${tip ? ' · ' + tip : ''}</p>
      ${benefitsHTML(h)}${consHTML(h)}
      <div class="actions">
        ${actions}
        <button class="link" data-act="clave" data-id="${h.id}">${h.clave ? 'Quitar clave' : 'Marcar clave'}</button>
        <button class="link" data-act="edit" data-id="${h.id}">Editar</button>
      </div>
    </div>`;
  }

  return `<section class="habit${justDone === h.id ? ' pop' : ''}${sched ? '' : ' off'}" data-id="${h.id}" style="${colorVar(h)}">
    <div class="row">
      <button class="check ${checkClass}" data-act="${act}" data-id="${h.id}" style="${style}"
        aria-label="${m ? 'Deshacer' : 'Marcar hecho'}">${inner}</button>
      <button class="title" data-act="toggle" data-id="${h.id}">
        <div class="name">${esc(h.nombre)}${h.clave ? ' ·' : ''}</div>
        <div class="identity">${esc(h.identidad)}</div>
      </button>
      <span class="streak${s.streak ? ' on' : ''}" title="Racha">${flame(!s.streak)}${s.streak}</span>
    </div>
    ${warn ? `<p class="warn">Ayer no se realizó. Que no pase dos veces: ${esc(h.minima)}.</p>` : ''}
    ${detail}
  </section>`;
}

function setMark(h, value) {
  state.log[h.id] ??= {};
  if (value) state.log[h.id][today()] = value; else delete state.log[h.id][today()];
  if (value !== 'just') delete state.razones[h.id]?.[today()];
  if (!value) { delete state.progreso[h.id]?.[today()]; delete state.timers[h.id]; }
  save(); render();
}

// Modo veces: cada toque suma uno; al llegar a la meta, se completa.
function plusOne(h, delta = 1) {
  const t = today();
  state.progreso[h.id] ??= {};
  const p = Math.max(0, progressOf(h, t) + delta);
  state.progreso[h.id][t] = p;
  if (p >= h.meta) { complete(h, 'full'); return; }
  navigator.vibrate?.(10);
  save(); render();
  const el = document.querySelector(`.habit[data-id="${h.id}"] .check .pv`);
  if (el) { el.style.transform = 'scale(1.3)'; setTimeout(() => el.style.transform = '', 200); }
}

// Modo cronómetro: toque para arrancar o pausar; al cumplir los minutos, se completa.
function toggleTimer(h) {
  const tm = state.timers[h.id] || { acum: 0, start: 0 };
  if (tm.start) { tm.acum += (Date.now() - tm.start) / 1000; tm.start = 0; }
  else tm.start = Date.now();
  state.timers[h.id] = tm;
  navigator.vibrate?.(10);
  save(); render();
}
function tickTimers() {
  for (const h of state.habits) {
    const tm = state.timers[h.id];
    if (!tm?.start || mark(h, today())) continue;
    const e = elapsedOf(h), goal = h.meta * 60;
    if (e >= goal) { delete state.timers[h.id]; state.progreso[h.id] = { ...(state.progreso[h.id] || {}), [today()]: goal }; complete(h, 'full'); continue; }
    const btn = document.querySelector(`.habit[data-id="${h.id}"] .check`);
    if (btn) { btn.style.setProperty('--p', `${Math.min(100, e / goal * 100)}%`); const pv = btn.querySelector('.pv'); if (pv) pv.textContent = fmtSec(goal - e); }
  }
}
setInterval(tickTimers, 1000);

// Aviso corto con título, texto y «Entendido».
const dialogResult = (title, html) => showMsg(`<h2>${title}</h2><p class="meta" style="margin-top:12px">${html}</p>
  <div class="dialog-actions"><button class="primary" data-close>Entendido</button></div>`);
function showMsg(html) {
  $('#msg').innerHTML = html;
  $('#msg-dialog').showModal();
}

function sparks(h) {
  const el = document.querySelector(`.habit[data-id="${h.id}"] .check`);
  if (!el || matchMedia('(prefers-reduced-motion: reduce)').matches) return;
  for (let i = 0; i < 10; i++) {
    const a = i / 10 * Math.PI * 2, r = 26 + Math.random() * 14;
    const dot = document.createElement('span');
    dot.className = 'spark';
    dot.style.cssText = `--dx:${Math.cos(a) * r}px;--dy:${Math.sin(a) * r}px`;
    el.appendChild(dot);
    setTimeout(() => dot.remove(), 700);
  }
}

function complete(h, value) {
  justDone = h.id;
  setMark(h, value);
  justDone = null;
  sparks(h);
  setTimeout(() => celebrate(h), 350);
}

const CHECK = '<svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M3.5 8.5l3 3L12.5 5"/></svg>';

// Al cumplir, la recompensa: el fuego se enciende, la racha sube y se marca el día en la semana.
function celebrate(h) {
  const n = stats(h).streak;
  const monday = addDays(new Date(), -((new Date().getDay() + 6) % 7));
  const week = ['L', 'M', 'X', 'J', 'V', 'S', 'D'].map((l, i) => {
    const day = dayKey(addDays(monday, i)), isToday = day === today();
    return `<div class="wk${isToday ? ' today' : isDone(h, day) ? ' done' : ''}"><i>${isToday || isDone(h, day) ? CHECK : ''}</i>${l}</div>`;
  }).join('');
  const el = $('#celebration');
  el.innerHTML = `<canvas class="cele-canvas"></canvas><div class="cele-inner">
    <div class="cele-flame"><div class="sunburst"></div><div class="cele-glow"></div>${flame()}</div>
    <div class="roll" aria-label="${n}"><div class="roll-inner"><span>${Math.max(0, n - 1)}</span><span>${n}</span></div></div>
    <p class="cele-label">${n === 1 ? 'día de racha' : 'días de racha'}</p>
    <div class="week">${week}</div>
    <p class="motivation">${motivation(n)}</p>
    <p class="meta">${esc(h.celebracion || '¡Así se hace!')} +1 voto · ${esc(h.identidad)}</p>
    <div class="cele-benefits">${benefitsHTML(h)}
      ${h.recompensa ? `<p class="meta" style="margin-top:12px">Te has ganado: <b>${esc(h.recompensa)}</b></p>` : ''}</div>
    <button class="cele-go" id="cele-go">Continuar</button>
  </div>`;
  el.classList.remove('out', 'lit');
  el.hidden = false;
  $('#cele-go').focus({ preventScroll: true });
  const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
  // Encendido: squash, resorte, sunburst, chispas y el número que rueda, todo a la vez.
  const ignite = () => {
    el.classList.add('lit');
    el.querySelector('.roll')?.classList.add('go');
    navigator.vibrate?.([12, 40, 24, 40, 8]);
    if (!reduce) {
      const f = el.querySelector('.cele-flame').getBoundingClientRect();
      emberBurst(el.querySelector('.cele-canvas'), f.left + f.width / 2, f.top + f.height * .55);
    }
    setTimeout(() => el.querySelector('.wk.today')?.classList.add('fill'), reduce ? 0 : 450);
  };
  reduce ? ignite() : setTimeout(ignite, 700);
}

// Chispas de brasa en canvas: un solo color, con gravedad, arrastre y desvanecimiento.
function emberBurst(canvas, cx, cy) {
  const dpr = Math.min(devicePixelRatio || 1, 3);
  canvas.width = innerWidth * dpr; canvas.height = innerHeight * dpr;
  const ctx = canvas.getContext('2d');
  ctx.scale(dpr, dpr);
  const fire = getComputedStyle(document.documentElement).getPropertyValue('--fire').trim() || '#ff9600';
  const parts = Array.from({ length: 42 }, (_, i) => {
    const a = -Math.PI / 2 + (Math.random() - .5) * Math.PI * 1.6, v = 260 + Math.random() * 300;
    return { x: cx, y: cy, vx: Math.cos(a) * v, vy: Math.sin(a) * v, r: 1.6 + Math.random() * 2.6, life: .7 + Math.random() * .6, t: 0 };
  });
  let last = performance.now();
  const tick = now => {
    const dt = Math.min((now - last) / 1000, .05); last = now;
    ctx.clearRect(0, 0, innerWidth, innerHeight);
    let alive = false;
    for (const p of parts) {
      p.t += dt;
      if (p.t >= p.life) continue;
      alive = true;
      p.vy += 900 * dt; p.vx *= .985; p.vy *= .985;
      p.x += p.vx * dt; p.y += p.vy * dt;
      const k = 1 - p.t / p.life;
      ctx.globalAlpha = k * k;
      ctx.fillStyle = fire;
      ctx.beginPath(); ctx.arc(p.x, p.y, p.r * (0.6 + 0.4 * k), 0, Math.PI * 2); ctx.fill();
    }
    ctx.globalAlpha = 1;
    if (alive) requestAnimationFrame(tick); else ctx.clearRect(0, 0, innerWidth, innerHeight);
  };
  requestAnimationFrame(tick);
}

function closeCelebration() {
  const el = $('#celebration');
  if (el.hidden) return;
  el.classList.add('out');
  setTimeout(() => { el.hidden = true; el.classList.remove('out'); }, 200);
}
$('#celebration').addEventListener('click', e => { if (e.target.id === 'cele-go') closeCelebration(); });
document.addEventListener('keydown', e => { if (e.key === 'Escape') closeCelebration(); });

$('#list').addEventListener('click', e => {
  const btn = e.target.closest('button[data-act]');
  if (!btn) return;
  const h = state.habits.find(x => x.id === btn.dataset.id);
  switch (btn.dataset.act) {
    case 'full': complete(h, 'full'); break;
    case 'min': complete(h, 'min'); break;
    case 'skip':
      // Antes de saltarlo, la consecuencia, dicha en voz alta.
      showMsg(`<h2>¿Hoy no?</h2>
        ${consHTML(h)}
        <p class="meta" style="margin-top:16px">La versión mínima cuenta: <b>${esc(h.minima)}</b></p>
        <input id="motivo" class="reason" placeholder="¿Por qué no? (opcional, para tu análisis)" maxlength="140" value="${esc(state.motivos[h.id]?.[today()] || '')}">
        <div class="dialog-actions">
          <button class="link" data-confirm-skip="${h.id}">Aun así, hoy no</button>
          ${JUST_PER_MONTH - justUsed(h, today().slice(0, 7)) > 0 ? `<button class="link" data-justify="${h.id}|${today()}">Justificar</button>` : ''}
          <button class="primary" data-do-min="${h.id}">Hago 2 min</button>
        </div>`);
      break;
    case 'undo': setMark(h, null); break;
    case 'plus': plusOne(h, 1); break;
    case 'minus': plusOne(h, -1); break;
    case 'timer': toggleTimer(h); break;
    case 'treset': delete state.timers[h.id]; save(); render(); break;
    case 'toggle': open.has(h.id) ? open.delete(h.id) : open.add(h.id); render(); break;
    case 'clave': h.clave = !h.clave; save(); render(); break;
    case 'edit': openForm(h); break;
    case 'add-in': openForm(null, { padre: h.id }); break;
  }
});

$('#msg-dialog').addEventListener('click', e => {
  const t = e.target;
  if (t === $('#msg-dialog') || t.hasAttribute('data-close')) $('#msg-dialog').close();
  if (t.dataset.confirmSkip) {
    setMotivo(t.dataset.confirmSkip, today(), $('#motivo')?.value);
    setMark(state.habits.find(x => x.id === t.dataset.confirmSkip), 'skip');
    $('#msg-dialog').close();
  }
  if (t.dataset.doMin) {
    $('#msg-dialog').close();
    complete(state.habits.find(x => x.id === t.dataset.doMin), 'min');
  }
  if (t.dataset.confirmDelete) {
    const id = t.dataset.confirmDelete;
    state.habits.forEach(x => { if (x.padre === id) x.padre = ''; });
    state.habits = state.habits.filter(x => x.id !== id); forget(id);
    delete state.log[id];
    delete state.razones[id]; delete state.motivos[id];
    save(); renderAll(); $('#msg-dialog').close();
  }
  if (t.dataset.justify) justifyForm(...t.dataset.justify.split('|'));
  if (t.dataset.saveMotivo) {
    const [id, day] = t.dataset.saveMotivo.split('|');
    setMotivo(id, day, $('#motivo').value);
    save(); renderAll(); $('#msg-dialog').close();
  }
  if (t.dataset.saveJust) {
    const [id, day] = t.dataset.saveJust.split('|');
    const reason = $('#reason').value.trim();
    if (!reason) { $('#reason').focus(); return; }
    state.log[id] ??= {}; state.razones[id] ??= {};
    state.log[id][day] = 'just';
    state.razones[id][day] = reason;
    save(); renderAll(); $('#msg-dialog').close();
  }
  if (t.dataset.unjust) {
    const [id, day] = t.dataset.unjust.split('|');
    delete state.log[id][day];
    delete state.razones[id]?.[day];
    save(); renderAll(); $('#msg-dialog').close();
  }
});

const longDate = day => new Date(day + 'T12:00').toLocaleDateString('es', { weekday: 'long', day: 'numeric', month: 'long' });

// Motivo de un día no hecho: el día sigue en rojo; solo sirve para entenderte en Análisis.
function setMotivo(id, day, text) {
  text = String(text || '').trim();
  if (text) { (state.motivos[id] ??= {})[day] = text; }
  else if (state.motivos[id]) { delete state.motivos[id][day]; if (!Object.keys(state.motivos[id]).length) delete state.motivos[id]; }
}
function missForm(id, day) {
  const h = state.habits.find(x => x.id === id);
  const left = JUST_PER_MONTH - justUsed(h, day.slice(0, 7));
  showMsg(`<h2>Día no hecho</h2>
    <p class="meta">${esc(h.nombre)} · ${longDate(day)}</p>
    <p class="meta">Apunta por qué no se pudo. Sigue en rojo, pero en Análisis verás qué te frena.</p>
    <input id="motivo" class="reason" placeholder="¿Qué pasó?" maxlength="140" value="${esc(state.motivos[h.id]?.[day] || '')}">
    <div class="dialog-actions">
      ${left > 0 ? `<button class="link" data-justify="${id}|${day}">Justificar</button>` : ''}
      <button class="link" data-close>Cancelar</button>
      <button class="primary" data-save-motivo="${id}|${day}">Guardar</button>
    </div>`);
  $('#motivo').focus();
}

function justifyForm(id, day) {
  const h = state.habits.find(x => x.id === id);
  const left = JUST_PER_MONTH - justUsed(h, day.slice(0, 7));
  if (left <= 0) {
    showMsg(`<h2>Sin justificaciones</h2>
      <p class="meta">Ya usaste las ${JUST_PER_MONTH} de este mes para «${esc(h.nombre)}». El mes que viene tendrás otras ${JUST_PER_MONTH}.</p>
      <div class="dialog-actions"><button class="primary" data-close>Entendido</button></div>`);
    return;
  }
  showMsg(`<h2>Justificar</h2>
    <p class="meta">${esc(h.nombre)} · ${longDate(day)}</p>

// ---------- Calendario
let view = 'hoy', calHabit = null, calMonth = new Date(new Date().getFullYear(), new Date().getMonth(), 1);

function dayStatus(h, day) {
  const t = today();
  if (day > t) return 'future';
  if (day < h.creado) return 'before';
  const m = mark(h, day);
  if (!m && !isSched(h, day)) return 'off';
  if (m === 'full') return 'done';
  if (m === 'min') return 'half';
  if (m === 'just') return 'just';
  if (day === t) return 'pending';
  return 'miss';
}

function renderCal() {
  const hs = state.habits.filter(h => !h.rutina);
  if (!hs.length) {
    $('#view-cal').innerHTML = '<p class="empty">Crea un hábito para ver su calendario.</p>';
    return;
  }
  if (!hs.some(h => h.id === calHabit)) calHabit = hs[0].id;
  const h = hs.find(x => x.id === calHabit);
  const y = calMonth.getFullYear(), mo = calMonth.getMonth();
  const monthKey = dayKey(calMonth).slice(0, 7);
  const offset = (calMonth.getDay() + 6) % 7;
  const total = new Date(y, mo + 1, 0).getDate();
  const counts = { done: 0, half: 0, miss: 0, just: 0 };
  let cells = ['L', 'M', 'X', 'J', 'V', 'S', 'D'].map(d => `<div class="wd">${d}</div>`).join('');
  cells += '<div></div>'.repeat(offset);
  for (let n = 1; n <= total; n++) {
    const day = dayKey(new Date(y, mo, n));
    const st = dayStatus(h, day);
    if (st in counts) counts[st]++;
    const tappable = st === 'miss' || st === 'just' || (st === 'pending');
    cells += `<button class="day ${st}${day === today() ? ' today' : ''}" data-day="${day}" style="--i:${n}"
      ${tappable ? '' : 'disabled'} aria-label="${longDate(day)}">${n}</button>`;
  }
  const done = counts.done + counts.half;
  const rate = done + counts.miss ? Math.round(done / (done + counts.miss) * 100) : null;
  const title = calMonth.toLocaleDateString('es', { month: 'long', year: 'numeric' });
  const isThisMonth = monthKey === today().slice(0, 7);

  $('#view-cal').innerHTML = `
    <div class="chips">${hs.map(x => `<button class="chip${x.id === h.id ? ' on' : ''}" data-habit="${x.id}" style="${colorVar(x)}">${icon(x.icono)}${esc(x.nombre)}</button>`).join('')}</div>
    <div class="month">
      <button data-month="-1" aria-label="Mes anterior">‹</button>
      <h2>${title[0].toUpperCase() + title.slice(1)}</h2>
      <button data-month="1" aria-label="Mes siguiente" ${isThisMonth ? 'disabled style="visibility:hidden"' : ''}>›</button>
    </div>
    <div class="grid">${cells}</div>
    <div class="legend"><span><i style="background:var(--green)"></i>Hecho</span><span><i style="background:var(--red)"></i>No hecho</span><span><i style="background:#9a9a9a"></i>Justificado</span></div>
    <div class="summary">
      <div><b>${rate === null ? '–' : rate + '%'}</b><span>acierto del mes</span></div>
      <div><b>${done}</b><span>días hechos</span></div>
      <div><b>${JUST_PER_MONTH - counts.just}</b><span>justificaciones libres</span></div>
    </div>`;
}

$('#view-cal').addEventListener('click', e => {

const fmtFecha = d => { const x = new Date(d + 'T12:00'), t = today(); if (d === t) return 'Hoy'; if (d === dayKey(addDays(new Date(), 1))) return 'Mañana'; return x.toLocaleDateString('es', { weekday: 'short', day: 'numeric', month: 'short' }); };

// ---------- Google Tasks: sincronización en los dos sentidos con tu cuenta de Google.
// Se usa tu propio «Client ID» de Google Cloud; el permiso (token) dura una hora y vive solo en este teléfono.
const G_API = 'https://tasks.googleapis.com/tasks/v1/';
const gCfg = () => { try { return JSON.parse(localStorage.getItem('habit-gtasks')) || {}; } catch { return {}; } };
const gSetCfg = c => { try { localStorage.setItem('habit-gtasks', JSON.stringify(c)); } catch {} };
let gSyncing = false, gAutoT = 0;
const gValid = () => { const c = gCfg(); return c.token && c.exp > Date.now() + 60000; };
function gLoad() {
  return new Promise((res, rej) => {
    if (window.google?.accounts?.oauth2) return res();
    const sc = document.createElement('script'); sc.src = 'https://accounts.google.com/gsi/client'; sc.async = true;

// Pide el permiso con un toque (ventana de Google). La primera vez pregunta; después suele ser inmediato.
async function gToken(interactive) {
  if (gValid()) return gCfg().token;
  if (!interactive) return null;
  await gLoad();
  return new Promise((res, rej) => {
    const client = google.accounts.oauth2.initTokenClient({
      client_id: gCfg().clientId, scope: 'https://www.googleapis.com/auth/tasks',
      callback: r => { if (r.error) return rej(new Error(r.error_description || r.error)); gSetCfg({ ...gCfg(), token: r.access_token, exp: Date.now() + (r.expires_in || 3600) * 1000, ok: true }); res(r.access_token); },

    });

}
const gSnap = x => JSON.stringify([x.titulo, x.detalle || '', x.fecha || '', !!x.hecha]);
const gBody = x => ({ title: x.titulo, notes: x.detalle || '', due: x.fecha ? x.fecha + 'T00:00:00.000Z' : null, status: x.hecha ? 'completed' : 'needsAction', ...(x.hecha ? {} : { completed: null }) });
// Regla: lo que cambiaste en la app desde la última sincronización sube a Google; si no, manda lo de Google.
async function gSync(interactive) {
  if (gSyncing) return;
  gSyncing = true; if (view === 'tareas') renderTareas();
  try {
    const tok = await gToken(interactive); if (!tok) return;
    const api = async (path, opt = {}) => {
      const r = await fetch(G_API + path, { ...opt, headers: { Authorization: 'Bearer ' + tok, 'Content-Type': 'application/json' } });
      if (r.status === 401) { gSetCfg({ ...gCfg(), token: '', exp: 0 }); throw new Error('El permiso de Google caducó. Vuelve a sincronizar.'); }
      if (!r.ok) throw new Error(`Google respondió ${r.status}.`);
      return r.status === 204 ? null : r.json();
    };
    const T = state.tareas, dead = new Set(state.borrados);
    const glists = (await api('users/@me/lists?maxResults=100')).items || [];
    for (const gl of glists) {
      if (dead.has('gl:' + gl.id)) { await api(`users/@me/lists/${gl.id}`, { method: 'DELETE' }); continue; }
      let L = T.listas.find(l => l.gid === gl.id) || (gl === glists[0] && T.listas.find(l => !l.gid && l.id === 'inbox'));
      if (!L) { L = { id: crypto.randomUUID(), nombre: gl.title }; T.listas.push(L); }
      L.gid = gl.id;
      if (L.gsnap !== undefined && L.nombre !== L.gsnap) await api(`users/@me/lists/${gl.id}`, { method: 'PATCH', body: JSON.stringify({ title: L.nombre }) });
      else L.nombre = gl.title;
      L.gsnap = L.nombre;
    }
    const vivas = new Set(glists.map(g => g.id));
    for (const L of T.listas) {
      if (L.gid && !vivas.has(L.gid) && !dead.has('gl:' + L.gid)) { delete L.gid; delete L.gsnap; }   // borrada en Google: se vuelve a crear
      if (!L.gid) { const gl = await api('users/@me/lists', { method: 'POST', body: JSON.stringify({ title: L.nombre }) }); L.gid = gl.id; L.gsnap = L.nombre; }
    }
    for (const L of T.listas) {
      const gitems = []; let page = '';
      do { const r = await api(`lists/${L.gid}/tasks?showCompleted=true&showHidden=true&maxResults=100${page ? '&pageToken=' + page : ''}`); gitems.push(...(r.items || [])); page = r.nextPageToken; } while (page);
      const seen = new Set();
      for (const g of gitems) {
        if (g.deleted || !g.title) continue;
        if (dead.has('g:' + g.id)) { await api(`lists/${L.gid}/tasks/${g.id}`, { method: 'DELETE' }); continue; }
        seen.add(g.id);
        const remote = { titulo: g.title, detalle: g.notes || '', fecha: g.due ? g.due.slice(0, 10) : '', hecha: g.status === 'completed' };
        let x = T.items.find(i => i.gid === g.id);
        if (!x) { x = { id: crypto.randomUUID(), gid: g.id, lista: L.id, creado: Date.now(), repite: '', dias: [], ...remote, hechaEn: remote.hecha ? Date.parse(g.completed || '') || Date.now() : 0 }; x.gsnap = gSnap(x); T.items.push(x); continue; }
        x.lista = L.id;
        if (gSnap(x) !== x.gsnap) await api(`lists/${L.gid}/tasks/${g.id}`, { method: 'PATCH', body: JSON.stringify(gBody(x)) });
        else { if (remote.hecha && !x.hecha) x.hechaEn = Date.now(); Object.assign(x, remote); }
        x.gsnap = gSnap(x);
      }
      for (const x of T.items.filter(i => i.lista === L.id)) {
        if (x.gid && !seen.has(x.gid)) { T.items = T.items.filter(i => i !== x); forget(x.id); }   // borrada en Google
        else if (!x.gid) { const g = await api(`lists/${L.gid}/tasks`, { method: 'POST', body: JSON.stringify(gBody(x)) }); x.gid = g.id; x.gsnap = gSnap(x); }
      }
    }
    gSetCfg({ ...gCfg(), ultima: Date.now() });
    save();
  } catch (e) {
    if (interactive) dialogResult('Google Tasks', esc(e.message || 'No se pudo sincronizar.'));
  } finally {
    gSyncing = false; if (view === 'tareas') renderTareas();
  }
}
// Tras cada cambio en Tareas, si hay algo nuevo o distinto y el permiso sigue vivo, se sincroniza solo.
function gAuto() {
  if (!gCfg().clientId || !gValid() || gSyncing) return;
  const T = state.tareas;
  if (!T.items.some(x => !x.gid || gSnap(x) !== x.gsnap) && !T.listas.some(l => !l.gid || l.nombre !== l.gsnap)) return;
  clearTimeout(gAutoT); gAutoT = setTimeout(() => gSync(false), 2500);
}

// Repetición al estilo Google Tasks: al completar, nace la siguiente con la fecha que toca.
const REPITE = { dia: 'Cada día', laborables: 'Días laborables', semana: 'Cada semana', quincena: 'Cada 2 semanas', mes: 'Cada mes', anio: 'Cada año', dias: 'Días concretos' };
function nextDate(x) {
  const t = today(); let d = new Date((x.fecha || t) + 'T12:00');
  const step = () => {
    switch (x.repite) {
      case 'dia': d = addDays(d, 1); break;
      case 'laborables': do d = addDays(d, 1); while (wd(dayKey(d)) > 4); break;
      case 'semana': d = addDays(d, 7); break;
      case 'quincena': d = addDays(d, 14); break;
      case 'mes': { const day = new Date((x.fecha || t) + 'T12:00').getDate(); d = new Date(d.getFullYear(), d.getMonth() + 1, 1, 12); d.setDate(Math.min(day, new Date(d.getFullYear(), d.getMonth() + 1, 0).getDate())); break; }
      case 'anio': d = new Date(d.getFullYear() + 1, d.getMonth(), d.getDate(), 12); break;
      case 'dias': { const ds = x.dias?.length ? x.dias : ALL_DAYS; do d = addDays(d, 1); while (!ds.includes(wd(dayKey(d)))); break; }
      default: return false;
    }
    return true;
  };
  if (!step()) return '';
  for (let i = 0; i < 400 && dayKey(d) < t; i++) step();   // nunca nace ya atrasada
  return dayKey(d);
}
// Completar: el círculo rebota, el check se dibuja, la línea tacha el título y la fila se recoge hacia Completadas.

function animateComplete(el, then) {

    el.style.height = el.offsetHeight + 'px'; el.offsetHeight; // fija la altura para poder recogerla

}

// La hora se guarda como 'HH:MM' (24 h) y se elige y muestra en 12 h con AM/PM.
function fmtHora(hhmm) {
  const [H, M] = hhmm.split(':').map(Number);
  return `${H % 12 || 12}:${String(M).padStart(2, '0')} ${H < 12 ? 'AM' : 'PM'}`;
}
function setTime(hhmm) {
  const f = $('#form');
  if (!hhmm) { $('#h-hour').value = ''; $('#h-min').value = '00'; return; }
  const [H, M] = hhmm.split(':').map(Number);
  $('#h-hour').value = String(H % 12 || 12);
  $('#h-min').value = String(M - M % 5).padStart(2, '0');
  f.elements.ampm.value = H < 12 ? 'AM' : 'PM';
}
function readTime() {
  const h = $('#h-hour').value;
  if (!h) return '';
  const H = (+h % 12) + ($('#form').elements.ampm.value === 'PM' ? 12 : 0);
  return `${String(H).padStart(2, '0')}:${$('#h-min').value}`;
}

// ---------- Análisis: gráficas de progreso y motivos. Todo en SVG propio, sin librerías.
let anaRange = 30, anaHabit = '', anaSel = null;
const RANGES = [[30, '30 días'], [90, '90 días'], [0, 'Todo']];
const fmtShort = d => new Date(d + 'T12:00').toLocaleDateString('es', { day: 'numeric', month: 'short' });
const normText = t => String(t || '').trim().toLowerCase().replace(/\s+/g, ' ').replace(/[.!]+$/, '');

// Días que contaban en el periodo para un hábito: solo los programados, sin hoy si aún no está marcado.
function anaDays(h, from) {
  const t = today(), out = [];
  for (let d = new Date((h.creado > from ? h.creado : from) + 'T12:00'); dayKey(d) <= t; d = addDays(d, 1)) {
    const k = dayKey(d);
    if (!isSched(h, k) && !mark(h, k)) continue;
    const m = mark(h, k);
    if (k === t && !m) continue;
    out.push({ day: k, st: isDone(h, k) ? 'done' : isJust(h, k) ? 'just' : 'miss' });
  }
  return out;
}
const rateOf = rows => { const done = rows.filter(r => r.st === 'done').length, miss = rows.filter(r => r.st === 'miss').length; return done + miss ? Math.round(done / (done + miss) * 100) : null; };
function bestStreak(h) {
  let best = 0, cur = 0;
  for (let d = new Date(h.creado + 'T12:00'); dayKey(d) <= today(); d = addDays(d, 1)) {
    const k = dayKey(d);
    if (isDone(h, k)) { cur++; best = Math.max(best, cur); }
    else if (isSched(h, k) && !isJust(h, k) && k !== today()) cur = 0;
  }
  return best;
}
const weekStart = day => { const d = new Date(day + 'T12:00'); return dayKey(addDays(d, -wd(day))); };

// Barras verticales finas con extremo redondeado; la seleccionada enseña su valor.
function barsSVG(items, key, { max = 100, unit = '%' } = {}) {
  const W = 320, H = 120, padB = 22, padT = 16, gap = 2;
  const n = items.length; if (!n) return '';
  const bw = Math.min(28, (W - gap * (n - 1)) / n), step = (W - bw * n) / Math.max(1, n - 1);
  const usable = H - padB - padT, y0 = H - padB;
  const every = n > 14 ? Math.ceil(n / 7) : n > 7 ? 2 : 1;
  let g = `<line x1="0" y1="${y0}" x2="${W}" y2="${y0}" class="axis"/>`;
  items.forEach((it, i) => {
    const x = i * (bw + step), v = it.value, hgt = v === null ? 0 : Math.max(3, v / max * usable);
    const sel = anaSel === key + i, r = Math.min(4, bw / 2);
    g += `<g class="bar${sel ? ' sel' : ''}" data-sel="${key}${i}">
      <rect x="${x}" y="${padT}" width="${bw}" height="${usable}" fill="transparent"/>
      ${v === null ? `<rect x="${x}" y="${y0 - 3}" width="${bw}" height="3" class="nodata"/>`
        : `<path d="M${x} ${y0} v${-(hgt - r)} a${r} ${r} 0 0 1 ${r} ${-r} h${bw - 2 * r} a${r} ${r} 0 0 1 ${r} ${r} v${hgt - r} z" class="fill"/>`}
      ${i % every === 0 || sel ? `<text x="${x + bw / 2}" y="${H - 6}" class="lbl">${it.label}</text>` : ''}
      ${sel || (v !== null && (n <= 8 || i === n - 1)) ? `<text x="${x + bw / 2}" y="${y0 - hgt - 5}" class="val">${v === null ? 'sin datos' : v + unit}${sel && it.tip ? ' · ' + it.tip : ''}</text>` : ''}
    </g>`;
  });
  return `<svg class="chart" viewBox="0 0 ${W} ${H}" role="img">${g}</svg>`;
}
// Línea de 2 px con un punto en el último valor; tocar un punto enseña su valor.
function lineSVG(items, key, { unit = '' } = {}) {
  const W = 320, H = 120, padB = 22, padT = 14, n = items.length; if (n < 2) return '';
  const max = Math.max(1, ...items.map(i => i.value)), usable = H - padB - padT, y0 = H - padB;
  const X = i => n === 1 ? W / 2 : i / (n - 1) * (W - 8) + 4, Y = v => y0 - v / max * usable;
  const pts = items.map((it, i) => `${X(i).toFixed(1)},${Y(it.value).toFixed(1)}`).join(' ');
  const every = n > 14 ? Math.ceil(n / 6) : n > 7 ? 2 : 1;
  let g = `<line x1="0" y1="${y0}" x2="${W}" y2="${y0}" class="axis"/><line x1="0" y1="${Y(max)}" x2="${W}" y2="${Y(max)}" class="grid"/>
    <polyline points="${pts}" class="line"/>`;
  items.forEach((it, i) => {
    const sel = anaSel === key + i, last = i === n - 1;
    g += `<g class="pt${sel ? ' sel' : ''}" data-sel="${key}${i}"><rect x="${X(i) - (W / n) / 2}" y="${padT}" width="${W / n}" height="${usable}" fill="transparent"/>
      ${sel || last ? `<circle cx="${X(i)}" cy="${Y(it.value)}" r="4" class="dot"/><text x="${X(i)}" y="${Y(it.value) - 8}" class="val" text-anchor="${i > n * .8 ? 'end' : i < n * .2 ? 'start' : 'middle'}">${it.value}${unit}${sel ? ' · ' + it.label : ''}</text>` : ''}
      ${i % every === 0 ? `<text x="${X(i)}" y="${H - 6}" class="lbl" text-anchor="${i === 0 ? 'start' : last ? 'end' : 'middle'}">${it.label}</text>` : ''}
    </g>`;
  });
  return `<svg class="chart" viewBox="0 0 ${W} ${H}" role="img">${g}</svg>`;
}
const hbar = (label, value, max, right, color) => `<div class="hbar"><span class="hl">${label}</span>
  <span class="ht"><i style="width:${max ? Math.max(2, value / max * 100) : 0}%${color ? `;background:${color}` : ''}"></i></span><span class="hv">${right}</span></div>`;

function renderAnalisis() {
  const hs = state.habits.filter(h => !h.rutina);
  const V = $('#view-analisis');
  if (!hs.length) { V.innerHTML = '<p class="empty">Crea un hábito y marca unos días para ver tu análisis.</p>'; return; }
  if (anaHabit && !hs.some(h => h.id === anaHabit)) anaHabit = '';
  const sel = anaHabit ? hs.filter(h => h.id === anaHabit) : hs;
  const from = anaRange ? dayKey(addDays(new Date(), -(anaRange - 1))) : '0000-00-00';
  const rows = sel.flatMap(h => anaDays(h, from).map(r => ({ ...r, h })));
  const rate = rateOf(rows), done = rows.filter(r => r.st === 'done').length;
  const best = Math.max(0, ...sel.map(bestStreak));
  const votes = sel.reduce((n, h) => n + stats(h).done, 0);

  // Semana a semana (lunes a domingo).
  const weeks = new Map();
  for (const r of rows) { const k = weekStart(r.day); (weeks.get(k) || weeks.set(k, []).get(k)).push(r); }
  const wk = [...weeks.keys()].sort().slice(-26).map(k => ({ label: fmtShort(k), value: rateOf(weeks.get(k)), tip: `${weeks.get(k).filter(r => r.st === 'done').length}/${weeks.get(k).filter(r => r.st !== 'just').length}` }));

  // Acumulado de días hechos.
  const byDay = new Map();
  for (const r of rows) if (r.st === 'done') byDay.set(r.day, (byDay.get(r.day) || 0) + 1);
  const days = [...new Set(rows.map(r => r.day))].sort();
  let acc = 0; const cum = days.map(d => { acc += byDay.get(d) || 0; return { label: fmtShort(d), value: acc }; });
  const cumS = cum.length > 60 ? cum.filter((_, i) => i % Math.ceil(cum.length / 60) === 0 || i === cum.length - 1) : cum;

  // Por día de la semana.
  const wdRows = ALL_DAYS.map(i => rows.filter(r => wd(r.day) === i));
  const wdItems = ALL_DAYS.map(i => ({ label: DAY_L[i], value: rateOf(wdRows[i]), tip: `${wdRows[i].filter(r => r.st === 'done').length} hechos` }));

  // Por hábito.
  const perH = hs.map(h => { const rs = anaDays(h, from); return { h, rate: rateOf(rs), done: rs.filter(r => r.st === 'done').length, best: bestStreak(h) }; }).sort((a, b) => (b.rate ?? -1) - (a.rate ?? -1));

  // Motivos: los de días no hechos y los de días justificados, juntos y contados.
  const motivos = [];
  for (const h of sel) {
    for (const [day, text] of Object.entries(state.motivos[h.id] || {})) if (day >= from && !isDone(h, day) && !isJust(h, day)) motivos.push({ day, h, text, tipo: 'No hecho' });
    for (const [day, text] of Object.entries(state.razones[h.id] || {})) if (day >= from && isJust(h, day)) motivos.push({ day, h, text, tipo: 'Justificado' });
  }
  const groups = new Map();
  for (const m of motivos) { const k = normText(m.text); const g = groups.get(k) || groups.set(k, { text: m.text, n: 0, habits: new Set() }).get(k); g.n++; g.habits.add(m.h.nombre); }
  const top = [...groups.values()].sort((a, b) => b.n - a.n).slice(0, 8);
  const missNoReason = rows.filter(r => r.st === 'miss' && !state.motivos[r.h.id]?.[r.day]).length;
  const recent = motivos.sort((a, b) => b.day < a.day ? -1 : 1).slice(0, 6);

  V.innerHTML = `
    <div class="chips">${RANGES.map(([v, l]) => `<button class="chip${anaRange === v ? ' on' : ''}" data-range="${v}">${l}</button>`).join('')}</div>
    <div class="chips">
      <button class="chip${!anaHabit ? ' on' : ''}" data-ahabit="">Todos</button>
      ${hs.map(x => `<button class="chip${x.id === anaHabit ? ' on' : ''}" data-ahabit="${x.id}" style="${colorVar(x)}">${icon(x.icono)}${esc(x.nombre)}</button>`).join('')}
    </div>
    <div class="summary ana-hero">
      <div><b>${rate === null ? '–' : rate + '%'}</b><span>acierto</span></div>
      <div><b>${done}</b><span>días hechos</span></div>
      <div><b>${best}</b><span>mejor racha</span></div>
      <div><b>${votes}</b><span>votos</span></div>
    </div>
    ${rows.length ? `
    <section class="ana"><h3>Acierto por semana</h3>${wk.length ? barsSVG(wk, 'w') : '<p class="meta">Aún no hay semanas completas.</p>'}</section>
    <section class="ana"><h3>Días hechos acumulados</h3>${cumS.length > 1 ? lineSVG(cumS, 'c') : '<p class="meta">Marca al menos dos días.</p>'}</section>
    <section class="ana"><h3>Por día de la semana</h3>${barsSVG(wdItems, 'd')}</section>
    ${!anaHabit && hs.length > 1 ? `<section class="ana"><h3>Por hábito</h3>${perH.map(p => hbar(`${icon(p.h.icono)}${esc(p.h.nombre)}`, p.rate ?? 0, 100, p.rate === null ? '–' : `${p.rate}% · ${flame(!p.best)}${p.best}`, p.h.color || 'var(--text)')).join('')}</section>` : ''}
    <section class="ana"><h3>Por qué no</h3>
      ${top.length ? top.map(g => hbar(esc(g.text) + (anaHabit || g.habits.size > 1 ? '' : ` <small>${esc([...g.habits][0])}</small>`), g.n, top[0].n, g.n)).join('') : '<p class="meta">Sin motivos apuntados todavía.</p>'}
      ${missNoReason ? `<p class="meta" style="margin-top:10px">${missNoReason} ${missNoReason === 1 ? 'día no hecho sin motivo' : 'días no hechos sin motivo'}. Tócalos en el calendario para apuntar qué pasó.</p>` : ''}
      ${recent.length ? `<div class="recent">${recent.map(m => `<div><span class="meta">${fmtShort(m.day)} · ${esc(m.h.nombre)} · ${m.tipo}</span><p>${esc(m.text)}</p></div>`).join('')}</div>` : ''}
    </section>` : '<p class="empty">No hay días registrados en este periodo.</p>'}`;
}
$('#view-analisis').addEventListener('click', e => {
  const r = e.target.closest('[data-range]'); if (r) { anaRange = +r.dataset.range; anaSel = null; renderAnalisis(); return; }

const EMPTY_DAY = { enfoque: 0, sesiones: 0, interrupciones: 0, resistidas: 0, aperturas: 0, distraccion: 0, alternativas: 0, concretos: 0, iniciativas: 0, pasos: 0, fomoSi: 0, fomoNo: 0 };

// ---------- Hábitos y tareas: los del propio Habit Tracker.
function pendientes() {
  const s = HT();
  const t = today(), w = wd(t);
  const firstHour = h => (h.horas || [])[0] || '99';
  const habits = (s.habits || [])
    .filter(h => !h.rutina && (!h.creado || h.creado <= t) && (h.dias?.length ? h.dias : ALL_DAYS).includes(w) && !s.log?.[h.id]?.[t])
    .sort((a, b) => firstHour(a) < firstHour(b) ? -1 : firstHour(a) > firstHour(b) ? 1 : 0);
  const items = (s.tareas?.items || []).filter(x => !x.hecha);
  const due = items.filter(x => x.fecha && x.fecha <= t).sort((a, b) => a.fecha < b.fecha ? -1 : a.fecha > b.fecha ? 1 : 0);
  const sinFecha = items.filter(x => !x.fecha).sort((a, b) => (b.creado || 0) - (a.creado || 0));
  return { habits, due, sinFecha, nombre: s.nombre || '' };
}
const nombre = () => HT().nombre || '';
const fmtHora = hhmm => { if (!/^\d\d:\d\d$/.test(hhmm || '')) return ''; let [h, m] = hhmm.split(':').map(Number); const ap = h < 12 ? 'AM' : 'PM'; h = h % 12 || 12; return `${h}:${String(m).padStart(2, '0')} ${ap}`; };
const fmtFecha = f => { const t = today(); if (f === t) return 'Hoy'; if (f === dayKey(addDays(new Date(), -1))) return 'Ayer'; return new Date(f + 'T12:00').toLocaleDateString('es', { day: 'numeric', month: 'short' }); };

function recordatorio() {

  return [prTxt, ini, prTxt ? '' : hab].filter(Boolean).join('<hr style="border:0;border-top:1px solid var(--line);margin:12px 0">');
}
function recordatorioHabito() {
  const p = pendientes(); if (!p) return '';
  const h = p.habits.find(h => h.contras?.length) || p.habits[0];
  if (h) return `<b>${esc(h.nombre)}</b> sigue pendiente hoy.${h.contras?.length ? `<span class="red">Si no lo haces: ${esc(h.contras[0])}</span>` : h.minima ? `<span>Versión de 2 minutos: ${esc(h.minima)}</span>` : ''}`;

function renderWeek() {

function paintFocus() {

    <p class="note">${fmtMin(mins)} de enfoque${s.que ? ` en «${esc(s.que)}»` : ''} · ${s.ints ? `${s.ints} ${s.ints === 1 ? 'interrupción' : 'interrupciones'}` : 'sin interrupciones'}. Hoy llevas ${fmtMin(dayOf(k).enfoque)}.</p>

    </div>`);
  $('#fr-again').onclick = () => focusForm(s.que, s.min, s.pro);
  $('#fr-animo')?.addEventListener('click', e => {

    ES.animo.push({ id: crypto.randomUUID(), d: k, antes: s.animo, despues: +c.dataset.v }); ES.animo = ES.animo.slice(-200); guardar();
    $('#fr-animo').closest('.field').outerHTML = `<p class="meta">${animoTxt()}</p>`;

// ---------- La puerta: espera, recordatorio y límite antes de abrir una distracción
function appPicker() {
  const d = dayOf(), wait = gateWait();
  showSheet(`<h2>¿Qué quieres abrir?</h2>
    <p class="note">Aperturas hoy: ${d.aperturas} de ${ES.limite} · ${d.distraccion} de ${ES.presupuesto} min. La próxima espera es de ${fmtSec(wait)}${sobreLimite() ? ' y tendrás que escribir una frase' : ''}.</p>
    <p class="sci">${enVentana() ? `Estás en tu ventana de revisión hasta las ${fmtHora(addMin(enVentana(), ES.ventanaMin))}.` : `Fuera de tu ventana de revisión: la espera es el doble. La próxima es a las ${fmtHora(proximaVentana())}; lo que hay ahí seguirá ahí.`}</p>
    <div class="rows">${ES.apps.map(a => `<button class="row" data-app="${esc(a.id)}"><span class="dot"></span><span class="t"><div>${esc(a.nombre)}</div></span><span class="tag">›</span></button>`).join('')}</div>

// Cada apertura del día duplica la espera: 10 s, 20 s, 40 s… hasta 3 minutos.
// Fuera de las ventanas de revisión la espera es el doble (revisar por lotes, no a cada rato).
const gateWait = () => Math.min(240, ES.espera * 2 ** dayOf().aperturas * (enVentana() ? 1 : 2));
const toMin = hhmm => { const [h, m] = hhmm.split(':').map(Number); return h * 60 + m; };
const nowMin = () => { const d = new Date(); return d.getHours() * 60 + d.getMinutes(); };
function enVentana() { const n = nowMin(); return ES.ventanas.find(v => n >= toMin(v) && n < toMin(v) + ES.ventanaMin) || ''; }
function proximaVentana() { const n = nowMin(), vs = [...ES.ventanas].sort(); return vs.find(v => toMin(v) > n) || vs[0]; }
const sobreLimite = () => { const d = dayOf(); return d.aperturas >= ES.limite || d.distraccion >= ES.presupuesto; };
let gate = null;
function openGate(app) {
  if (!app) return;

  gate.emo = '';
  $('#gate-body').innerHTML = `
    <p class="lead">Ibas a abrir <b>${esc(app.nombre)}</b></p>
    <div class="breath"><span id="g-br">Inhala</span></div>
    <p class="count" id="g-count"></p>
    ${why ? `<div class="why">${why}</div>` : ''}
    <div class="field" style="width:100%;margin:0"><label style="text-align:left">Mientras esperas: ¿qué sientes ahora?</label>
      <div class="chips" id="g-emo">${EMOCIONES.map(m => `<button class="chip" data-e="${m}">${m}</button>`).join('')}</div>
      <p class="meta" id="g-emo-tip" style="text-align:left;margin:8px 0 0"></p></div>
    ${ES.config.grises ? '' : `<p class="meta" style="margin:0">Con la pantalla en grises el feed atrae menos (Zimmermann y Sobolev, 2023).</p>`}
    <p class="note" style="margin:0">${enVentana() ? '' : `Fuera de tu ventana de revisión (próxima: ${fmtHora(proximaVentana())}). `}Si sales de esta pantalla, la espera vuelve a empezar.</p>
    <button class="primary wide" id="g-no">Mejor no</button>`;
  $('#gate').hidden = false;

  });

function paintGate() {

// Al volver de la distracción se cuenta cuánto duró de verdad.
let salidaOculta = false;
function checkSalida(force = false) {

  ES.salida = null;
  const k = dayKey(new Date(s.en));

  showSheet(`<h2>Volviste de ${esc(s.app)}</h2>
    <p class="note">${medido ? `Estuviste fuera unos ${fmtMin(real)}; planeaste ${fmtMin(s.min)}.` : 'No se pudo medir: pasaron más de 4 horas. Se cuentan los minutos que planeaste.'}</p>

    <p style="margin:0 0 12px">¿Había algo que de verdad te habrías perdido?</p>

      ${personasDue()[0] ? `<button class="primary" id="sv-per">Escríbele a ${esc(personasDue()[0].nombre)}</button>` : ''}

      <button class="link" id="sv-close">Cerrar</button></div>`;
    $('#sv-per')?.addEventListener('click', () => personaSheet(personasDue()[0]));
    $('#sv-focus').onclick = () => focusForm();
    $('#sv-close').onclick = closeSheet;
  });

// ---------- Prioridades del día: tres como máximo y la más difícil primero.
function renderPrio() {
  const P = ES.prioridades.fecha === today() ? ES.prioridades : (ES.prioridades = { fecha: today(), items: [] });
  const done = P.items.filter(x => x.hecho).length;
  $('#prio').innerHTML = P.items.length ? `<div class="rows">${P.items.map((x, i) => `<div class="row" style="${x.hecho ? 'opacity:.5' : ''}">
      <button class="box" data-pchk="${esc(x.id)}" aria-label="Hecha" style="${x.hecho ? 'background:var(--green);border-color:var(--green)' : ''}"></button>
      <button class="t" data-pgo="${esc(x.id)}" style="text-align:left"><div style="${x.hecho ? 'text-decoration:line-through' : ''}">${esc(x.t)}</div><small>${i === 0 ? 'La rana: primero, antes que todo' : x.origen || 'Prioridad'}</small></button>
      <span class="tag" style="font-weight:600;color:${i === 0 ? 'var(--red)' : 'var(--muted)'}">${i + 1}</span></div>`).join('')}</div>
    <p class="more">${done} de ${P.items.length} hechas · <button class="link" id="prio-edit">Cambiar</button></p>`
    : `<button class="row" id="prio-edit" style="border-bottom:1px solid var(--line)"><span class="dot" style="--c:var(--red)"></span><span class="t"><div>Elige tus prioridades de hoy</div><small>Tres como máximo. La más difícil va primero.</small></span><span class="tag">›</span></button>`;
}

function prioCandidatos() {

  for (const x of ht?.due || []) out.push({ t: x.titulo, origen: x.fecha < t ? 'Tarea vencida' : 'Tarea de hoy' });
  for (const p of personasDue().slice(0, 3)) out.push({ t: `Escribirle a ${p.nombre}`, origen: 'Iniciativa', per: p.id });
  for (const pl of planesProximos().filter(pl => pl.fecha === t)) out.push({ t: `${cap(pl.titulo)}${pl.con ? ' con ' + pl.con : ''}`, origen: 'Plan de hoy' });

  return out;
}
